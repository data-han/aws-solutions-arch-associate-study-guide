<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Mock Exam 1 — 65 Questions</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 1.4rem; font-weight: 600; color: #f8fafc; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 2rem; }
    .scoreboard { background: #1e2433; border: 1px solid #2d3748; border-radius: 10px; padding: 1rem 1.5rem; margin-bottom: 2rem; display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
    .score-label { font-size: 0.8rem; color: #64748b; margin-bottom: 0.2rem; }
    .score-value { font-size: 1.5rem; font-weight: 700; color: #f8fafc; }
    .score-value span { font-size: 0.9rem; color: #64748b; font-weight: 400; }
    .pass-mark { font-size: 0.8rem; color: #64748b; margin-left: auto; }
    .reset-btn { background: #1e2433; border: 1px solid #374151; color: #94a3b8; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .reset-btn:hover { border-color: #6366f1; color: #e2e8f0; }
    .question-card { background: #1e2433; border: 1px solid #2d3748; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem; }

    .question-header { display: flex; gap: 0.75rem; align-items: flex-start; margin-bottom: 1.1rem; }
    .q-number { background: #2d3748; color: #94a3b8; font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 5px; flex-shrink: 0; margin-top: 2px; }
    .q-text { font-size: 0.95rem; line-height: 1.55; color: #e2e8f0; }
    .q-multi-hint { font-size: 0.75rem; color: #818cf8; margin-top: 0.35rem; font-weight: 600; }
    .options { display: flex; flex-direction: column; gap: 0.5rem; }
    .option { display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.65rem 0.9rem; border: 1px solid #2d3748; border-radius: 8px; cursor: pointer; transition: border-color 0.15s, background 0.15s; user-select: none; }
    .option:hover:not(.disabled) { border-color: #6366f1; background: #252d3f; }
    .option.selected { border-color: #6366f1; background: #252d3f; }
    .option.disabled { cursor: default; }
    .option.correct { border-color: #22c55e; background: #052e16; }
    .option.wrong { border-color: #ef4444; background: #2d0a0a; }
    .option.missed { border-color: #f59e0b; background: #1c1500; }
    .option.neutral { border-color: #2d3748; }
    .option-letter { font-size: 0.8rem; font-weight: 700; color: #64748b; flex-shrink: 0; margin-top: 1px; width: 1rem; text-align: center; }
    .option.correct .option-letter { color: #22c55e; }
    .option.wrong .option-letter { color: #ef4444; }
    .option.missed .option-letter { color: #f59e0b; }
    .option.selected .option-letter { color: #818cf8; }
    .option-body { flex: 1; }
    .option-text { font-size: 0.9rem; color: #cbd5e1; line-height: 1.45; }
    .option-explanation { display: none; font-size: 0.82rem; margin-top: 0.4rem; line-height: 1.5; }
    .option.correct .option-explanation, .option.wrong .option-explanation, .option.missed .option-explanation, .option.neutral .option-explanation { display: block; }
    .option.correct .option-explanation { color: #86efac; }
    .option.wrong .option-explanation { color: #fca5a5; }
    .option.missed .option-explanation { color: #fcd34d; }
    .option.neutral .option-explanation { color: #64748b; }
    .option-icon { flex-shrink: 0; font-size: 0.85rem; margin-top: 2px; display: none; }
    .option.correct .option-icon::after { content: "✓"; color: #22c55e; display: block; }
    .option.wrong .option-icon::after { content: "✗"; color: #ef4444; display: block; }
    .option.missed .option-icon::after { content: "✓"; color: #f59e0b; display: block; }
    .option.correct .option-icon, .option.wrong .option-icon, .option.missed .option-icon { display: block; }
    .reveal-btn { margin-top: 1rem; background: #6366f1; color: #fff; border: none; padding: 0.5rem 1.2rem; border-radius: 7px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
    .reveal-btn:hover { background: #4f46e5; }
    .reveal-btn:disabled { opacity: 0.4; cursor: default; }
    .result-badge { display: none; margin-left: 0.75rem; font-size: 0.78rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 20px; }
    .result-badge.correct-badge { background: #052e16; color: #22c55e; border: 1px solid #166534; }
    .result-badge.wrong-badge { background: #2d0a0a; color: #ef4444; border: 1px solid #991b1b; }
  </style>

<body>
<div class="container">
  <h1>Mock Exam 1 — Full 65-Question Simulation</h1>
  <p class="subtitle">Pass mark ≈ 72% (47/65). Answer all questions, then review every miss.</p>
  <div class="scoreboard">
    <div><div class="score-label">Score</div><div class="score-value" id="score-display">0 <span>/ 0</span></div></div>
    <div><div class="score-label">Answered</div><div class="score-value" id="answered-display">0 <span>/ 65</span></div></div>
    <div class="pass-mark">Pass: ≥ 47 / 65</div>
    <button class="reset-btn" onclick="resetAll()">Reset</button>
  </div>
  <div id="quiz"></div>
</div>
<script>
const questions = [
  { q: "An EC2-based app needs least-privilege access to a specific S3 bucket. What's the best approach?", correct: "B", options: { A: { text: "Embed IAM user keys in the app", explanation: "Long-lived access keys in application code are a credential leak risk — the anti-pattern to avoid." }, B: { text: "Attach an IAM role (instance profile) scoped to that bucket", explanation: "Correct. Instance profiles deliver temporary, automatically-rotated credentials via the metadata service. No keys stored anywhere." }, C: { text: "Make the bucket public", explanation: "Public bucket removes all access control — violates least-privilege entirely." }, D: { text: "Use the root account credentials", explanation: "Root credentials have unlimited permissions and should never be used for application access." } } },
  { q: "Which control can explicitly DENY traffic from one IP at the subnet level?", correct: "B", options: { A: { text: "Security group", explanation: "Security groups are stateful and allow-only — you cannot write a deny rule." }, B: { text: "Network ACL", explanation: "Correct. NACLs support explicit deny rules and operate at the subnet level — the only AWS control that can block a specific IP." }, C: { text: "IAM policy", explanation: "IAM controls API-level access to AWS services, not network traffic." }, D: { text: "WAF web ACL", explanation: "WAF operates at Layer 7 HTTP/HTTPS and attaches to ALB/CloudFront — not at the subnet level for all traffic." } } },
  { q: "A company needs automatic rotation of database credentials. Which service?", correct: "B", options: { A: { text: "KMS", explanation: "KMS manages encryption keys — not application credentials or their rotation." }, B: { text: "Secrets Manager", explanation: "Correct. Secrets Manager natively rotates RDS, Redshift, and DocumentDB credentials on a schedule." }, C: { text: "Parameter Store (String)", explanation: "Standard Parameter Store strings are unencrypted and have no built-in rotation." }, D: { text: "IAM", explanation: "IAM manages identities and policies — not database credential rotation." } } },
  { q: "Which provides agentless threat detection by analyzing CloudTrail, VPC Flow Logs, and DNS logs?", correct: "B", options: { A: { text: "Inspector", explanation: "Inspector scans for software vulnerabilities in EC2 instances and containers — not agentless threat detection from logs." }, B: { text: "GuardDuty", explanation: "Correct. GuardDuty is fully agentless and analyzes exactly those three sources to detect threats and anomalies." }, C: { text: "Macie", explanation: "Macie discovers and classifies sensitive data (PII) in S3 — not a threat detection service." }, D: { text: "Config", explanation: "Config tracks resource configuration compliance — not threat detection from network/API logs." } } },
  { q: "A guardrail must prevent member accounts in an Organization from leaving a Region, even for admins. Use:", correct: "B", options: { A: { text: "IAM permissions boundary", explanation: "Permissions boundaries apply to individual IAM identities — account admins can modify or remove them from themselves." }, B: { text: "Service Control Policy", explanation: "Correct. SCPs at the org root set a hard ceiling across all accounts — even account admins and root can't exceed what an SCP allows." }, C: { text: "Bucket policy", explanation: "Bucket policies control access to S3 buckets — not account-wide region restrictions." }, D: { text: "Session policy", explanation: "Session policies are temporary restrictions applied during AssumeRole — not account-wide guardrails." } } },
  { q: "To serve a private S3 bucket only via CloudFront:", correct: "B", options: { A: { text: "Make bucket public", explanation: "Making the bucket public means anyone can access S3 directly — defeats the 'private' requirement." }, B: { text: "Use Origin Access Control + restrictive bucket policy", explanation: "Correct. OAC gives CloudFront an identity; the bucket policy allows only that identity — direct S3 access is denied to everyone else." }, C: { text: "Enable Transfer Acceleration", explanation: "Transfer Acceleration speeds up S3 uploads — nothing to do with access control." }, D: { text: "Use an Interface Endpoint", explanation: "Interface endpoints route traffic privately to AWS services — not a mechanism for restricting S3 access to CloudFront." } } },
  { q: "Auditors need to know who terminated an EC2 instance and when. Which service?", correct: "B", options: { A: { text: "CloudWatch", explanation: "CloudWatch monitors metrics and logs — it doesn't record who made API calls." }, B: { text: "CloudTrail", explanation: "Correct. CloudTrail logs every API call including TerminateInstances — records the caller identity, timestamp, and parameters." }, C: { text: "Config", explanation: "Config tracks configuration state changes but doesn't record the actor of every API call." }, D: { text: "VPC Flow Logs", explanation: "VPC Flow Logs capture network traffic metadata — not API actions." } } },
  { q: "Protect a public web app from SQL injection at the edge:", correct: "B", options: { A: { text: "Shield Standard", explanation: "Shield Standard protects against DDoS at the network/transport layer — not Layer 7 SQL injection." }, B: { text: "WAF", explanation: "Correct. WAF is a Layer 7 firewall with managed rules for SQLi/XSS that attaches to CloudFront, ALB, or API Gateway." }, C: { text: "NACL", explanation: "NACLs operate at Layer 4 — no payload inspection capability." }, D: { text: "GuardDuty", explanation: "GuardDuty analyzes logs for threat detection — it doesn't filter or block HTTP requests." } } },
  { q: "Discover PII across many S3 buckets:", correct: "A", options: { A: { text: "Macie", explanation: "Correct. Macie uses ML to automatically discover and classify sensitive data including PII across S3 buckets." }, B: { text: "Inspector", explanation: "Inspector scans for vulnerabilities in EC2/containers — not S3 data classification." }, C: { text: "Detective", explanation: "Detective helps investigate security findings — not data classification." }, D: { text: "Config", explanation: "Config evaluates resource configuration — not data content in S3 buckets." } } },
  { q: "A workload requires single-tenant, customer-controlled FIPS 140-2 Level 3 key hardware. Use:", correct: "B", options: { A: { text: "KMS AWS-managed key", explanation: "KMS AWS-managed keys run on multi-tenant shared hardware — Level 2, not Level 3." }, B: { text: "CloudHSM", explanation: "Correct. CloudHSM is dedicated single-tenant, customer-controlled hardware meeting FIPS 140-2 Level 3." }, C: { text: "Secrets Manager", explanation: "Secrets Manager stores credentials/secrets — not an HSM for key management." }, D: { text: "ACM", explanation: "ACM manages TLS/SSL certificates — not a key hardware module." } } },
  { q: "Centralize sign-on to dozens of AWS accounts and SaaS apps with an external IdP:", correct: "B", options: { A: { text: "IAM users in each account", explanation: "Per-account IAM users don't scale across dozens of accounts and require separate credentials everywhere." }, B: { text: "IAM Identity Center", explanation: "Correct. IAM Identity Center provides SSO across AWS accounts and business apps, integrating with SAML IdPs like Okta or Azure AD." }, C: { text: "Cognito user pool", explanation: "Cognito is for consumer app end-users — not enterprise workforce SSO across AWS accounts." }, D: { text: "STS only", explanation: "STS issues temporary credentials but doesn't provide a centralized SSO portal or IdP integration out of the box." } } },
  { q: "Which protect S3 objects from accidental deletion? (Choose TWO.)", correct: ["A","C"], multi: true, options: { A: { text: "Versioning", explanation: "Correct. Versioning keeps deleted objects as delete markers — previous versions are recoverable." }, B: { text: "One Zone-IA", explanation: "One Zone-IA is a storage class — it does nothing to prevent deletion." }, C: { text: "MFA Delete", explanation: "Correct. MFA Delete requires multi-factor authentication to permanently delete object versions — prevents accidental or malicious removal." }, D: { text: "Reduced Redundancy", explanation: "Reduced Redundancy is a deprecated storage class with lower durability — doesn't protect against deletion." }, E: { text: "Transfer Acceleration", explanation: "Transfer Acceleration speeds up uploads — unrelated to deletion protection." } } },
  { q: "Default-secure encryption at rest for S3 with an auditable, customer-controlled key:", correct: "B", options: { A: { text: "SSE-C", explanation: "SSE-C requires you to provide and manage keys on every request — high overhead, no AWS-side audit trail." }, B: { text: "SSE-KMS (customer managed key)", explanation: "Correct. SSE-KMS with a customer managed key gives you control over the key policy, rotation, and CloudTrail audit of every key usage." }, C: { text: "No encryption", explanation: "No encryption fails both the 'encrypted at rest' and 'auditable key' requirements." }, D: { text: "Client-side only", explanation: "Client-side encryption keeps AWS out of the encryption process — no AWS audit trail and higher operational complexity." } } },
  { q: "A Lambda function needs DB credentials stored cheaply with no rotation requirement. Use:", correct: "B", options: { A: { text: "Secrets Manager", explanation: "Secrets Manager works but has a per-secret monthly cost — Parameter Store SecureString is free for standard parameters." }, B: { text: "SSM Parameter Store SecureString", explanation: "Correct. Parameter Store SecureString stores encrypted values at no additional cost — ideal when rotation isn't needed." }, C: { text: "Hardcode in code", explanation: "Hardcoded credentials appear in source code and version history — a serious security risk." }, D: { text: "S3 plaintext file", explanation: "Plaintext credentials in S3 are unencrypted and easily accessible — not secure." } } },
  { q: "Continuously evaluate whether all EBS volumes are encrypted and flag non-compliant ones:", correct: "B", options: { A: { text: "CloudTrail", explanation: "CloudTrail records the API calls that created volumes — it doesn't continuously evaluate whether they're encrypted." }, B: { text: "AWS Config", explanation: "Correct. AWS Config rules (like encrypted-volumes) continuously evaluate resources and flag non-compliant ones." }, C: { text: "GuardDuty", explanation: "GuardDuty detects threats — not configuration compliance." }, D: { text: "Trusted Advisor", explanation: "Trusted Advisor gives best-practice checks but doesn't provide continuous, real-time custom rule evaluation." } } },
  { q: "Securely access an EC2 shell with no open SSH port or bastion host:", correct: "B", options: { A: { text: "Open port 22 to 0.0.0.0/0", explanation: "Open SSH to the world is a major security risk — the opposite of the requirement." }, B: { text: "SSM Session Manager", explanation: "Correct. Session Manager opens a shell session through the SSM agent — no SSH port needed, no bastion host, fully auditable." }, C: { text: "Direct Connect", explanation: "Direct Connect is a private network link to AWS — not a method for accessing an EC2 shell." }, D: { text: "NAT Gateway", explanation: "NAT Gateway enables outbound internet from private subnets — not EC2 shell access." } } },
  { q: "Cross-account access to an S3 bucket should be granted by:", correct: "B", options: { A: { text: "Sharing IAM user keys", explanation: "Sharing keys is an anti-pattern — unauditable and hard to revoke cleanly." }, B: { text: "A bucket policy/role trust to the other account", explanation: "Correct. A bucket policy granting access to the other account's principals, or a cross-account IAM role, is the standard least-privilege approach." }, C: { text: "Making the bucket public", explanation: "Public bucket violates least privilege — anyone can access it, not just the target account." }, D: { text: "A NACL rule", explanation: "NACLs control network traffic at the subnet level — not S3 object access permissions." } } },
  { q: "A company wants L7 DDoS protection, cost protection, and 24/7 response team support:", correct: "B", options: { A: { text: "Shield Standard", explanation: "Shield Standard is automatic and free but provides only network/transport layer DDoS protection with no response team or cost protection." }, B: { text: "Shield Advanced", explanation: "Correct. Shield Advanced adds Layer 7 DDoS protection, cost protection against DDoS-induced scaling, and access to the DDoS Response Team." }, C: { text: "WAF only", explanation: "WAF blocks web attacks but has no DDoS response team or cost protection for DDoS events." }, D: { text: "GuardDuty", explanation: "GuardDuty detects threats in logs — it doesn't protect against DDoS attacks." } } },
  { q: "Which statement about security groups is TRUE?", correct: "C", options: { A: { text: "They are stateless", explanation: "Security groups are stateful — return traffic for an allowed connection is automatically permitted." }, B: { text: "They support deny rules", explanation: "Security groups are allow-only — you can only add allow rules, not deny rules." }, C: { text: "They are stateful and allow-only", explanation: "Correct. Security groups track connection state (stateful) and only support allow rules — no deny rules possible." }, D: { text: "They operate at the subnet level", explanation: "Security groups operate at the instance/ENI level — NACLs operate at the subnet level." } } },
  { q: "Encrypt data in transit to an ALB using a managed, free certificate:", correct: "B", options: { A: { text: "Self-signed cert", explanation: "Self-signed certs trigger browser warnings and require manual management — not 'managed and free'." }, B: { text: "AWS Certificate Manager (ACM)", explanation: "Correct. ACM issues and auto-renews free TLS/SSL certificates that integrate directly with ALB, CloudFront, and API Gateway." }, C: { text: "CloudHSM", explanation: "CloudHSM provides dedicated key hardware — not a certificate management service." }, D: { text: "KMS", explanation: "KMS manages encryption keys for at-rest encryption — not TLS certificates for in-transit encryption." } } },
  { q: "Survive a full AZ failure for a web fleet automatically and simply:", correct: "B", options: { A: { text: "Bigger instance", explanation: "Instance size doesn't help when an entire AZ goes offline — the instance goes with it." }, B: { text: "Auto Scaling group across multiple AZs behind an ALB", explanation: "Correct. ASG across AZs + ALB automatically redistributes traffic to healthy AZs — self-healing." }, C: { text: "Second Region active/active", explanation: "Cross-Region active/active is more complex and costly than needed for AZ-level resilience." }, D: { text: "Single instance with EIP", explanation: "Single instance in one AZ can't survive that AZ going down." } } },
  { q: "Decouple a spiky order system so no orders are lost when consumers fall behind:", correct: "B", options: { A: { text: "SNS direct to instances", explanation: "SNS push with no buffer — if instances are overwhelmed or offline, messages are dropped." }, B: { text: "SQS queue with consumers scaling on depth", explanation: "Correct. SQS durably buffers orders through spikes; consumers auto-scale on queue depth — no orders lost." }, C: { text: "Larger DB", explanation: "Larger database doesn't buffer inbound messages or protect the processing tier from being overwhelmed." }, D: { text: "CloudFront", explanation: "CloudFront is a CDN — unrelated to order processing decoupling." } } },
  { q: "Cheapest DR with multi-hour RTO/RPO acceptable:", correct: "D", options: { A: { text: "Active/active", explanation: "Active/active is the most expensive DR strategy — full production in two Regions simultaneously." }, B: { text: "Warm standby", explanation: "Warm standby keeps a scaled-down running environment — cheaper than active/active but more expensive than backup/restore." }, C: { text: "Pilot light", explanation: "Pilot light keeps only the core DB running — cheaper than warm standby but still more than backup/restore." }, D: { text: "Backup & restore", explanation: "Correct. Backup and restore is cheapest — pay only for stored backups. Multi-hour RTO/RPO makes this viable." } } },
  { q: "RDS must auto-fail-over to a synchronous standby with no data loss on AZ failure:", correct: "B", options: { A: { text: "Read replica", explanation: "Read replicas use async replication — potential data loss and no automatic write failover." }, B: { text: "Multi-AZ", explanation: "Correct. Multi-AZ keeps a synchronous standby in another AZ with automatic failover and zero data loss." }, C: { text: "Hourly snapshots", explanation: "Snapshots are point-in-time restores — hours of data loss and manual recovery." }, D: { text: "Larger instance", explanation: "Instance size doesn't affect AZ failure resilience." } } },
  { q: "Capture messages that fail processing repeatedly for later debugging:", correct: "B", options: { A: { text: "Long polling", explanation: "Long polling reduces empty receive calls — doesn't handle repeatedly failing messages." }, B: { text: "Dead-letter queue", explanation: "Correct. DLQ captures messages exceeding maxReceiveCount — sidelined for debugging without being dropped." }, C: { text: "Visibility timeout = 0", explanation: "Zero visibility timeout causes the message to immediately reappear — worsens the problem." }, D: { text: "FIFO", explanation: "FIFO enforces ordering — doesn't automatically capture failing messages for debugging." } } },
  { q: "Relational DB with cross-Region DR and sub-second replication lag:", correct: "B", options: { A: { text: "RDS Multi-AZ", explanation: "Multi-AZ is single-Region HA — standby in another AZ, not another Region." }, B: { text: "Aurora Global Database", explanation: "Correct. Aurora Global Database = relational, cross-Region, <1s replication lag, minutes-RTO failover." }, C: { text: "DynamoDB Global Tables", explanation: "Global Tables is cross-Region active-active but NoSQL — not relational." }, D: { text: "Single read replica", explanation: "Read replica is async and typically same-Region — doesn't provide cross-Region sub-second DR." } } },
  { q: "Stop logging users out when ASG replaces instances:", correct: "B", options: { A: { text: "Disable ASG", explanation: "Disabling ASG removes resilience and scaling — not a fix." }, B: { text: "Store sessions in ElastiCache/DynamoDB", explanation: "Correct. External session storage survives instance replacement — any instance serves any user." }, C: { text: "Sticky sessions only", explanation: "Sticky sessions help but if the sticky instance is terminated, the session is still lost." }, D: { text: "Larger instances", explanation: "Instance size doesn't prevent session loss on replacement." } } },
  { q: "Centralized, policy-based backups across EBS/RDS/DynamoDB/EFS with cross-Region copy:", correct: "B", options: { A: { text: "S3 lifecycle", explanation: "S3 lifecycle manages S3 objects only — can't back up EBS, RDS, or DynamoDB." }, B: { text: "AWS Backup", explanation: "Correct. AWS Backup centralizes backup management across all listed services with cross-Region copy and policy-driven scheduling." }, C: { text: "Manual snapshots", explanation: "Manual snapshots are error-prone and have no policy automation." }, D: { text: "Storage Gateway", explanation: "Storage Gateway is a hybrid storage service — not a cross-service backup management tool." } } },
  { q: "Route users to a standby Region automatically when the primary is unhealthy:", correct: "C", options: { A: { text: "Weighted routing", explanation: "Weighted routing splits traffic by percentage — not health-based failover." }, B: { text: "Latency routing", explanation: "Latency routing sends to the lowest-latency Region — not health-based active-passive failover." }, C: { text: "Failover routing", explanation: "Correct. Route 53 failover routing is active-passive — routes to secondary when primary health check fails." }, D: { text: "Simple routing", explanation: "Simple routing has no health check integration — always routes to the configured endpoint." } } },
  { q: "Ways to achieve high availability for a stateless web tier: (Choose TWO.)", correct: ["A","C"], multi: true, options: { A: { text: "Auto Scaling across AZs", explanation: "Correct. ASG across multiple AZs automatically replaces failed instances and spans AZ failures." }, B: { text: "Single large instance", explanation: "A single large instance is a single point of failure — it doesn't provide HA." }, C: { text: "Elastic Load Balancer with health checks", explanation: "Correct. ELB distributes traffic and health-checks instances — removes unhealthy instances from rotation automatically." }, D: { text: "Instance store for sessions", explanation: "Instance store is ephemeral and tied to one instance — sessions are lost on failure or replacement." }, E: { text: "One subnet only", explanation: "Single subnet = single AZ = single point of failure for AZ-level failures." } } },
  { q: "A multi-Region active-active NoSQL store with millisecond latency worldwide:", correct: "B", options: { A: { text: "RDS read replicas", explanation: "RDS read replicas are async, read-only, and typically not active-active for writes across Regions." }, B: { text: "DynamoDB Global Tables", explanation: "Correct. Global Tables replicates DynamoDB data across multiple Regions with active-active writes and millisecond latency." }, C: { text: "Aurora Multi-AZ", explanation: "Aurora Multi-AZ is single-Region HA — not cross-Region." }, D: { text: "ElastiCache", explanation: "ElastiCache is in-memory caching — not a multi-Region active-active database." } } },
  { q: "Private subnet instances need outbound internet for OS patches but must be unreachable inbound:", correct: "B", options: { A: { text: "Internet Gateway", explanation: "An internet gateway allows inbound connections too — instances become publicly reachable." }, B: { text: "NAT Gateway", explanation: "Correct. NAT Gateway allows outbound-only internet access from private subnets — inbound connections are blocked." }, C: { text: "VPC peering", explanation: "VPC peering connects VPCs to each other — not a path to the public internet." }, D: { text: "Direct Connect", explanation: "Direct Connect is a private connection to on-premises — not public internet access." } } },
  { q: "A self-healing compute layer that replaces failed instances automatically requires:", correct: "B", options: { A: { text: "Manual monitoring", explanation: "Manual monitoring doesn't automatically replace instances — requires human intervention." }, B: { text: "ASG + ELB health checks", explanation: "Correct. ASG detects unhealthy instances via ELB health checks and automatically launches replacements." }, C: { text: "Reserved Instances", explanation: "Reserved Instances affect pricing — not instance health monitoring or replacement." }, D: { text: "A bastion host", explanation: "A bastion host is for SSH access — not self-healing compute." } } },
  { q: "Connect hundreds of VPCs and on-prem networks through a central transitive hub:", correct: "B", options: { A: { text: "VPC peering", explanation: "VPC peering is point-to-point and non-transitive — connecting hundreds of VPCs requires hundreds squared of peering connections." }, B: { text: "Transit Gateway", explanation: "Correct. Transit Gateway acts as a central hub — all VPCs and on-prem connections attach once, and routing is transitive." }, C: { text: "Internet Gateway", explanation: "Internet Gateway connects a VPC to the public internet — not a private VPC connectivity hub." }, D: { text: "NAT Gateway", explanation: "NAT Gateway is for outbound internet from private subnets — not VPC interconnection." } } },
  { q: "A pilot-light DR design keeps which component running/replicating at all times?", correct: "B", options: { A: { text: "The full production fleet", explanation: "Full production fleet running in two Regions is active/active — not pilot light." }, B: { text: "The core database", explanation: "Correct. Pilot light keeps only the critical data tier (database) running and replicating — the app tier is spun up on demand during failover." }, C: { text: "Nothing", explanation: "Nothing running is backup/restore — pilot light keeps at least the database running." }, D: { text: "Only DNS", explanation: "DNS is managed by Route 53 — not what the pilot light strategy refers to as running continuously." } } },
  { q: "Read-heavy app with repeated identical queries overloading RDS — best fix with least change:", correct: "A", options: { A: { text: "ElastiCache caching layer", explanation: "Correct. ElastiCache caches repeated identical query results — the DB barely sees repeat calls. Minimal app change." }, B: { text: "Vertically scale forever", explanation: "Scaling up is expensive, hits a ceiling, and doesn't address the root cause of repeated identical queries." }, C: { text: "Switch to Redshift", explanation: "Redshift is an OLAP data warehouse — migrating the database is far from 'least change'." }, D: { text: "Enable Multi-AZ", explanation: "Multi-AZ is for HA — the standby is not readable and doesn't improve read performance." } } },
  { q: "Microsecond reads for hot DynamoDB items:", correct: "B", options: { A: { text: "GSI", explanation: "A Global Secondary Index allows different query patterns — not microsecond latency." }, B: { text: "DAX", explanation: "Correct. DynamoDB Accelerator (DAX) is an in-memory cache — reduces DynamoDB reads to microseconds for hot items." }, C: { text: "Global Tables", explanation: "Global Tables is cross-Region replication — not a latency reducer for local reads." }, D: { text: "Larger table", explanation: "Table size/capacity doesn't affect read latency." } } },
  { q: "Lowest-latency global delivery of cacheable images from S3:", correct: "B", options: { A: { text: "Transfer Acceleration", explanation: "Transfer Acceleration speeds up uploads to S3 — not downloads." }, B: { text: "CloudFront", explanation: "Correct. CloudFront caches images at edge locations globally — users download from the nearest edge, dramatically reducing latency." }, C: { text: "Bigger bucket", explanation: "S3 bucket size doesn't affect read latency." }, D: { text: "Cross-Region replication", explanation: "CRR replicates buckets across Regions but users still download from the S3 URL — no edge caching benefit." } } },
  { q: "Serverless ad-hoc SQL directly on data in S3:", correct: "B", options: { A: { text: "Redshift", explanation: "Redshift requires loading data into the cluster — not directly on S3, not serverless." }, B: { text: "Athena", explanation: "Correct. Athena is fully serverless SQL directly on S3 — pay per query, no infrastructure to manage." }, C: { text: "EMR", explanation: "EMR runs big data frameworks on managed clusters — more complex than needed for ad-hoc SQL." }, D: { text: "RDS", explanation: "RDS requires loading data and running a persistent instance." } } },
  { q: "Shared file system mounted concurrently by many Linux EC2 across AZs:", correct: "B", options: { A: { text: "EBS io2", explanation: "EBS is attached to one instance at a time (Multi-Attach is same-AZ only and limited) — not suitable for many instances across AZs." }, B: { text: "EFS", explanation: "Correct. EFS is a shared NFS file system that scales automatically and supports concurrent access from any number of Linux EC2 instances across AZs." }, C: { text: "Instance store", explanation: "Instance store is ephemeral local storage — can't be shared across instances." }, D: { text: "FSx for Windows", explanation: "FSx for Windows uses SMB protocol for Windows — not Linux NFS access." } } },
  { q: "Load balancer needing a static IP, L4, millions of req/s, ultra-low latency:", correct: "B", options: { A: { text: "ALB", explanation: "ALB is Layer 7 — no native static IP and higher latency than NLB." }, B: { text: "NLB", explanation: "Correct. NLB operates at Layer 4, supports Elastic (static) IPs, handles millions of req/s at ultra-low latency." }, C: { text: "GWLB", explanation: "GWLB is for third-party network appliances — not general application load balancing." }, D: { text: "Classic", explanation: "Classic LB is legacy — no static IP guarantee, lower performance." } } },
  { q: "EC2-attached volume needing guaranteed high IOPS for a database:", correct: "C", options: { A: { text: "gp2", explanation: "gp2 has burstable IOPS — can't consistently guarantee high IOPS under sustained load." }, B: { text: "st1", explanation: "st1 (Throughput Optimized HDD) has low IOPS — designed for sequential big-data, not transactional databases." }, C: { text: "io2", explanation: "Correct. io2 lets you provision specific IOPS — guaranteed, consistent performance for databases." }, D: { text: "sc1", explanation: "sc1 (Cold HDD) has the lowest IOPS of all EBS types — for cold, infrequently accessed data." } } },
  { q: "Spiky, unpredictable compute with zero cost when idle:", correct: "B", options: { A: { text: "Reserved EC2", explanation: "Reserved Instances charge you even when idle — they suit steady 24/7 usage." }, B: { text: "Lambda", explanation: "Correct. Lambda scales from zero and costs nothing when idle — charges only per invocation." }, C: { text: "Dedicated Host", explanation: "Dedicated Hosts are always-on, always-billed dedicated servers — most expensive option." }, D: { text: "Fixed fleet", explanation: "Fixed fleet must be sized for peak — you pay for idle capacity during off-peak hours." } } },
  { q: "Ordered real-time stream, multiple independent consumers, replay:", correct: "B", options: { A: { text: "SQS Standard", explanation: "SQS Standard has no ordering guarantee and delivers each message to one consumer — no replay." }, B: { text: "Kinesis Data Streams", explanation: "Correct. Kinesis preserves order within shards, supports multiple independent consumer groups, and allows replay within the retention window." }, C: { text: "SNS", explanation: "SNS is push-based — no persistent buffer, no ordering guarantees, no replay." }, D: { text: "SQS FIFO", explanation: "FIFO enforces order but each message is consumed once by one consumer — no replay or multiple independent consumers." } } },
  { q: "Global non-HTTP TCP app: static anycast IPs, AWS backbone, fast Region failover:", correct: "B", options: { A: { text: "CloudFront", explanation: "CloudFront is HTTP/HTTPS CDN — doesn't support arbitrary TCP and no static anycast IPs." }, B: { text: "Global Accelerator", explanation: "Correct. Global Accelerator provides static anycast IPs, routes over the AWS backbone, supports any TCP/UDP protocol, and fails over between Regions in seconds." }, C: { text: "Route 53 weighted", explanation: "Route 53 is DNS-based — not a single static IP, and DNS failover is slower." }, D: { text: "Transit Gateway", explanation: "Transit Gateway is a VPC connectivity hub — not a global traffic accelerator." } } },
  { q: "Route HTTP requests to different microservices based on URL path:", correct: "B", options: { A: { text: "NLB", explanation: "NLB operates at Layer 4 — no awareness of HTTP paths." }, B: { text: "ALB", explanation: "Correct. ALB supports path-based routing rules — routes /api/* to one target group, /web/* to another." }, C: { text: "GWLB", explanation: "GWLB is for network appliances — not path-based HTTP routing." }, D: { text: "Route 53 only", explanation: "Route 53 routes at the DNS level by domain name — not by URL path." } } },
  { q: "Stream data into S3/Redshift with no code and near-real-time delivery:", correct: "A", options: { A: { text: "Kinesis Data Firehose", explanation: "Correct. Firehose delivers streaming data to S3 and Redshift with built-in buffering — zero consumer code, no servers to manage." }, B: { text: "Kinesis Data Streams", explanation: "Data Streams is the raw stream — you must write and manage consumer application code." }, C: { text: "SQS", explanation: "SQS is a queue — not a streaming delivery service. Requires custom consumer code for S3/Redshift." }, D: { text: "Glue", explanation: "Glue is a batch ETL service — not real-time streaming delivery." } } },
  { q: "Windows application needing shared SMB storage integrated with Active Directory:", correct: "B", options: { A: { text: "EFS", explanation: "EFS is NFS for Linux — doesn't support SMB or Active Directory integration." }, B: { text: "FSx for Windows File Server", explanation: "Correct. FSx for Windows File Server is fully managed Windows SMB with native Active Directory integration." }, C: { text: "S3", explanation: "S3 is object storage — not a Windows file system." }, D: { text: "EBS", explanation: "EBS is block storage attached to a single instance — not a shared file system." } } },
  { q: "HPC/ML workload needing a high-throughput file system linked to S3:", correct: "B", options: { A: { text: "EFS", explanation: "EFS is a general-purpose NFS file system — not optimized for HPC throughput or native S3 integration." }, B: { text: "FSx for Lustre", explanation: "Correct. FSx for Lustre is a high-performance HPC/ML file system with native S3 integration — data seamlessly moves between Lustre and S3." }, C: { text: "EBS st1", explanation: "st1 is throughput HDD for sequential workloads — single instance, not a shared HPC file system." }, D: { text: "Instance store", explanation: "Instance store is ephemeral local storage — can't be shared across HPC nodes." } } },
  { q: "Improve database read performance/scalability: (Choose TWO.)", correct: ["A","B"], multi: true, options: { A: { text: "Add read replicas", explanation: "Correct. Read replicas offload read queries from the primary — scales read capacity horizontally." }, B: { text: "Add an ElastiCache cache", explanation: "Correct. ElastiCache caches repeated identical queries — the database barely sees repeat calls." }, C: { text: "Reduce instance size", explanation: "Reducing instance size decreases capacity — the opposite of improving performance." }, D: { text: "Disable backups", explanation: "Disabling automated backups disables point-in-time recovery — doesn't improve read performance." }, E: { text: "Use a single AZ", explanation: "Single AZ reduces HA — no performance benefit for reads." } } },
  { q: "Orchestrate a multi-step workflow across Lambda functions with retries and branching:", correct: "B", options: { A: { text: "SQS", explanation: "SQS is a queue — not a workflow orchestrator with retries, branching, and state tracking." }, B: { text: "Step Functions", explanation: "Correct. Step Functions orchestrates Lambda functions in sequences with built-in retries, error handling, branching, and visual tracking." }, C: { text: "SNS", explanation: "SNS routes events to subscribers — not a stateful workflow orchestrator." }, D: { text: "EventBridge", explanation: "EventBridge routes events to targets based on rules — not multi-step workflow orchestration with retries." } } },
  { q: "Managed REST API front end for Lambda with throttling and authentication:", correct: "B", options: { A: { text: "ALB", explanation: "ALB can proxy to Lambda but lacks built-in throttling, usage plans, and API key management." }, B: { text: "API Gateway", explanation: "Correct. API Gateway provides throttling, usage plans, API keys, Lambda integration, and multiple authorizer options out of the box." }, C: { text: "CloudFront", explanation: "CloudFront is a CDN — it doesn't provide API management or throttling." }, D: { text: "AppSync", explanation: "AppSync is a managed GraphQL service — not REST API management." } } },
  { q: "Fault-tolerant batch processing at the lowest compute cost:", correct: "C", options: { A: { text: "On-Demand", explanation: "On-Demand is the most expensive per-hour option — no savings for fault-tolerant workloads." }, B: { text: "Reserved", explanation: "Reserved suits steady 24/7 workloads — wasteful for occasional batch jobs." }, C: { text: "Spot", explanation: "Correct. Spot gives up to 90% savings and is ideal for fault-tolerant, restartable batch work." }, D: { text: "Dedicated Host", explanation: "Dedicated Hosts are the most expensive option — for licensing/compliance, not batch cost optimization." } } },
  { q: "Steady 24/7 workload for 3 years, max savings, flexible across EC2/Fargate/Lambda:", correct: "B", options: { A: { text: "Spot", explanation: "Spot can be reclaimed — not suitable for steady production workloads." }, B: { text: "Compute Savings Plans", explanation: "Correct. Compute Savings Plans give up to 72% savings with flexibility across EC2 families, Fargate, and Lambda." }, C: { text: "On-Demand", explanation: "On-Demand is most expensive — no savings for committed usage." }, D: { text: "More ASG", explanation: "ASG manages capacity, not unit pricing — doesn't reduce cost per compute hour." } } },
  { q: "Logs hot for 30 days, rare after, retain 7 years, hours-retrieval OK — cheapest:", correct: "B", options: { A: { text: "All in Standard", explanation: "Standard pays full price for 7 years — far more expensive than tiering to cheaper storage classes." }, B: { text: "Lifecycle to Standard-IA then Glacier Deep Archive, expire at 7y", explanation: "Correct. Tiered lifecycle matches the access pattern — expensive-fast early, cheaper-slow later, cheapest for the archive years." }, C: { text: "All in Glacier immediately", explanation: "Glacier from day 1 means retrieval fees and delays during the first 30 days of frequent access." }, D: { text: "One Zone-IA only", explanation: "One Zone-IA is single-AZ (durability risk) and doesn't reach archive pricing — more expensive long-term." } } },
  { q: "Unknown, changing S3 access pattern, minimize cost, no retrieval fees, no tuning:", correct: "B", options: { A: { text: "Standard-IA", explanation: "Standard-IA has retrieval fees — if access turns out to be frequent, costs can exceed Standard." }, B: { text: "Intelligent-Tiering", explanation: "Correct. Intelligent-Tiering monitors access and auto-moves objects between tiers — no retrieval fees, no manual work." }, C: { text: "Glacier", explanation: "Glacier assumes cold data — retrieval fees and delays if access pattern turns frequent." }, D: { text: "One Zone-IA", explanation: "One Zone-IA has retrieval fees, single-AZ durability risk, and requires knowing the access pattern." } } },
  { q: "Private instances pull large data from S3 via NAT, incurring high charges — cut cost:", correct: "B", options: { A: { text: "Bigger NAT", explanation: "NAT charges per GB processed — bigger gateway processes the same data, costing the same or more." }, B: { text: "S3 Gateway Endpoint", explanation: "Correct. S3 Gateway Endpoints are free and route S3 traffic within the AWS network, eliminating NAT data-processing charges." }, C: { text: "Public subnet", explanation: "Moving to a public subnet eliminates NAT charges but exposes instances to the internet — a security concern." }, D: { text: "Interface endpoint for S3", explanation: "S3 uses Gateway endpoints (free). Interface endpoints for S3 are possible but cost per-hour + per-GB — not the cost reduction option." } } },
  { q: "Alert when forecast monthly spend exceeds a threshold:", correct: "B", options: { A: { text: "Cost Explorer", explanation: "Cost Explorer analyzes historical costs — it doesn't send proactive threshold alerts." }, B: { text: "AWS Budgets", explanation: "Correct. Budgets sends alerts (email/SNS) when actual or forecasted spend hits the threshold." }, C: { text: "Trusted Advisor", explanation: "Trusted Advisor gives best-practice recommendations — not custom spend threshold alerts." }, D: { text: "CUR", explanation: "CUR provides detailed billing data — it's a data source, not an alerting tool." } } },
  { q: "Dev EC2 used only business hours — cheapest minimal-effort optimization:", correct: "B", options: { A: { text: "Reserved Instances", explanation: "Reserved Instances charge even when instances are stopped — wasteful for part-time dev usage." }, B: { text: "Schedule stop/start off-hours", explanation: "Correct. Stopping instances off-hours eliminates compute charges during idle time — minimal effort, no commitment." }, C: { text: "Spot for dev", explanation: "Spot Instances can be reclaimed unexpectedly — disruptive for developers needing predictable uptime." }, D: { text: "Permanent downsize", explanation: "Downsizing may break the workload and still pays for idle overnight/weekend hours." } } },
  { q: "Many accounts want one bill plus volume discounts:", correct: "B", options: { A: { text: "AWS Budgets", explanation: "Budgets is a cost alerting tool — not billing consolidation." }, B: { text: "Consolidated billing (Organizations)", explanation: "Correct. Organizations consolidated billing produces one invoice and aggregates usage for volume pricing discounts." }, C: { text: "Savings Plans", explanation: "Savings Plans reduce per-unit cost through commitment — not billing consolidation." }, D: { text: "Separate invoices", explanation: "Opposite of the requirement — separate invoices mean no consolidation and no aggregated discounts." } } },
  { q: "Variable, intermittent relational DB workload, idle much of the time — cost-optimal:", correct: "B", options: { A: { text: "Largest RDS instance", explanation: "Large fixed instance pays full price when idle — exactly the waste to avoid." }, B: { text: "Aurora Serverless v2", explanation: "Correct. Aurora Serverless v2 scales to near-zero ACUs when idle — you pay only for actual usage." }, C: { text: "Multi-AZ always on", explanation: "Multi-AZ runs two instances (primary + standby) — even more expensive, regardless of usage." }, D: { text: "DynamoDB provisioned", explanation: "DynamoDB is NoSQL, not relational. Provisioned capacity also charges for reserved capacity regardless of actual use." } } },
  { q: "Right-sizing recommendations to reduce EC2 over-provisioning costs:", correct: "A", options: { A: { text: "Compute Optimizer", explanation: "Correct. Compute Optimizer uses ML to analyze CloudWatch metrics and recommend optimal EC2 instance types, sizes, and EBS volumes." }, B: { text: "CloudTrail", explanation: "CloudTrail logs API calls — not resource utilization or right-sizing recommendations." }, C: { text: "Config", explanation: "Config evaluates configuration compliance — not utilization or sizing recommendations." }, D: { text: "GuardDuty", explanation: "GuardDuty detects threats — completely unrelated to cost optimization." } } },
  { q: "Cheapest S3 class for infrequently accessed, easily re-creatable data in one AZ:", correct: "B", options: { A: { text: "Standard", explanation: "Standard is multi-AZ and more expensive — overkill for easily re-creatable data." }, B: { text: "One Zone-IA", explanation: "Correct. One Zone-IA stores in a single AZ (acceptable for re-creatable data) at lower cost than Standard-IA." }, C: { text: "Glacier Deep Archive", explanation: "Deep Archive has hours-long retrieval — not suitable if the data needs to be available quickly when accessed." }, D: { text: "Intelligent-Tiering", explanation: "Intelligent-Tiering has a monitoring fee per object — less cost-effective for known infrequent access patterns." } } },
  { q: "Reduce data-transfer and improve performance for repeated content served from an origin:", correct: "A", options: { A: { text: "CloudFront caching", explanation: "Correct. CloudFront caches responses at edge locations — repeated requests are served from cache, reducing origin calls and data-transfer-out charges." }, B: { text: "Larger origin instance", explanation: "Bigger origin helps under load but doesn't reduce the number of requests hitting the origin or data transfer costs." }, C: { text: "More NAT Gateways", explanation: "NAT Gateways are for outbound internet from private subnets — unrelated to content caching." }, D: { text: "Cross-Region replication", explanation: "CRR replicates S3 objects — doesn't cache content at the edge or reduce data transfer from the origin." } } },
  { q: "Cost-effective ways to handle unpredictable spiky traffic: (Choose TWO.)", correct: ["A","C"], multi: true, options: { A: { text: "AWS Lambda", explanation: "Correct. Lambda scales automatically and costs nothing when idle — ideal for unpredictable spikes." }, B: { text: "Fixed large EC2 fleet running 24/7", explanation: "Fixed fleet sized for peak wastes money during off-peak — the opposite of cost-effective for spiky traffic." }, C: { text: "DynamoDB On-Demand capacity", explanation: "Correct. DynamoDB on-demand scales instantly to any throughput with no capacity planning — perfect for spiky workloads." }, D: { text: "Reserved Instances for peak", explanation: "Reserved Instances committed to peak capacity wastes money during off-peak periods." }, E: { text: "Dedicated Hosts", explanation: "Dedicated Hosts are always-on, always-billed — most expensive option for spiky workloads." } } }
];

let selected = new Array(questions.length).fill(null);
let revealed = new Array(questions.length).fill(false);

function isCorrect(qIndex) {
  const q = questions[qIndex];
  const sel = selected[qIndex];
  if (q.multi) { if (!sel || sel.size !== q.correct.length) return false; return q.correct.every(c => sel.has(c)); }
  return sel === q.correct;
}

function updateScore() {
  const answeredCount = revealed.filter(Boolean).length;
  const correctCount = revealed.filter((r, i) => r && isCorrect(i)).length;
  document.getElementById('score-display').innerHTML = `${correctCount} <span>/ ${answeredCount}</span>`;
  document.getElementById('answered-display').innerHTML = `${answeredCount} <span>/ ${questions.length}</span>`;
}

function selectOption(qIndex, letter) {
  if (revealed[qIndex]) return;
  const q = questions[qIndex];
  const card = document.querySelector(`[data-q="${qIndex}"]`);
  const optEl = card.querySelector(`[data-opt="${letter}"]`);
  if (q.multi) {
    if (!selected[qIndex]) selected[qIndex] = new Set();
    if (selected[qIndex].has(letter)) { selected[qIndex].delete(letter); optEl.classList.remove('selected'); }
    else { selected[qIndex].add(letter); optEl.classList.add('selected'); }
    card.querySelector('.reveal-btn').disabled = selected[qIndex].size === 0;
  } else {
    selected[qIndex] = letter;
    card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    optEl.classList.add('selected');
    card.querySelector('.reveal-btn').disabled = false;
  }
}

function reveal(qIndex) {
  if (revealed[qIndex]) return;
  revealed[qIndex] = true;
  const q = questions[qIndex];
  const card = document.querySelector(`[data-q="${qIndex}"]`);
  const sel = q.multi ? (selected[qIndex] || new Set()) : new Set(selected[qIndex] ? [selected[qIndex]] : []);
  const correctSet = new Set(q.multi ? q.correct : [q.correct]);
  card.classList.add('answered');
  card.querySelectorAll('.option').forEach(opt => {
    opt.classList.add('disabled');
    const letter = opt.dataset.opt;
    const isC = correctSet.has(letter), isS = sel.has(letter);
    opt.classList.remove('selected');
    if (isC && isS) opt.classList.add('correct');
    else if (isC && !isS) opt.classList.add('missed');
    else if (!isC && isS) opt.classList.add('wrong');
    else opt.classList.add('neutral');
  });
  const btn = card.querySelector('.reveal-btn');
  btn.disabled = true; btn.textContent = 'Revealed';
  const badge = card.querySelector('.result-badge');
  badge.style.display = 'inline-block';
  const correct = isCorrect(qIndex);
  const correctLabel = q.multi ? q.correct.join(' & ') : q.correct;
  if (correct) { badge.className = 'result-badge correct-badge'; badge.textContent = 'Correct'; }
  else { badge.className = 'result-badge wrong-badge'; badge.textContent = sel.size === 0 ? `No answer — ${correctLabel} correct` : `Wrong — ${correctLabel} correct`; }
  updateScore();
}

function resetAll() {
  selected = new Array(questions.length).fill(null);
  revealed = new Array(questions.length).fill(false);
  render(); updateScore();
}

function render() {
  document.getElementById('quiz').innerHTML = questions.map((q, i) => `
    <div class="question-card" data-q="${i}">
      <div class="question-header"><span class="q-number">Q${i+1}</span>
        <div style="flex:1"><div class="q-text">${q.q}</div>${q.multi ? '<div class="q-multi-hint">▸ Choose TWO</div>' : ''}</div>
      </div>
      <div class="options">${Object.entries(q.options).map(([letter, opt]) => `
        <div class="option" data-opt="${letter}" onclick="selectOption(${i},'${letter}')">
          <div class="option-letter">${letter}</div>
          <div class="option-body"><div class="option-text">${opt.text}</div><div class="option-explanation">${opt.explanation}</div></div>
          <div class="option-icon"></div>
        </div>`).join('')}
      </div>
      <div style="display:flex;align-items:center;margin-top:1rem;">
        <button class="reveal-btn" onclick="reveal(${i})" disabled>Reveal Answer</button>
        <span class="result-badge"></span>
      </div>
    </div>`).join('');
}

render(); updateScore();
</script>
</body>
</html>
