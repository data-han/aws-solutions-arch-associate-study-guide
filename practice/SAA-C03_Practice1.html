<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAA-C03 Practice Exam — 65 Questions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap');
:root {
  --bg:#0f1117; --surface:#181c27; --surface2:#1e2334; --border:#2a3050;
  --border-bright:#3d4f7c; --text:#e2e8f8; --muted:#7a8aaa;
  --accent:#ff9900; --accent2:#ffb84d; --correct:#22c55e; --wrong:#ef4444;
  --d1:#e05c5c; --d2:#4e9ef7; --d3:#34d399; --d4:#a78bfa;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.65;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:20px;height:56px}
.header-logo{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.08em;white-space:nowrap}
.header-sep{width:1px;height:24px;background:var(--border)}
.header-title{font-size:13px;color:var(--muted);font-weight:400;flex:1}
.score-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
.controls{padding:14px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface)}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:4px;font-family:var(--sans);font-size:12px;cursor:pointer;transition:all .15s}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(255,153,0,.08)}
.filter-btn.d1.active{border-color:var(--d1);color:var(--d1);background:rgba(224,92,92,.08)}
.filter-btn.d2.active{border-color:var(--d2);color:var(--d2);background:rgba(78,158,247,.08)}
.filter-btn.d3.active{border-color:var(--d3);color:var(--d3);background:rgba(52,211,153,.08)}
.filter-btn.d4.active{border-color:var(--d4);color:var(--d4);background:rgba(167,139,250,.08)}
.controls-right{margin-left:auto;display:flex;gap:8px}
.action-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:4px;font-family:var(--sans);font-size:12px;cursor:pointer;transition:all .15s}
.action-btn:hover{color:var(--text);border-color:var(--border-bright)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.action-btn.primary:hover{background:var(--accent2)}
.progress-wrap{padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.prog-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}
.prog-label{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.qlist{padding:20px 24px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .2s}
.qcard:hover{border-color:var(--border-bright)}
.qcard.answered-correct{border-left:3px solid var(--correct)}
.qcard.answered-wrong{border-left:3px solid var(--wrong)}
.qcard.hidden{display:none}
.qcard-header{padding:14px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;user-select:none}
.qnum{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:3px;min-width:28px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.04em}
.badge-d1{background:rgba(224,92,92,.15);color:var(--d1);border:1px solid rgba(224,92,92,.3)}
.badge-d2{background:rgba(78,158,247,.15);color:var(--d2);border:1px solid rgba(78,158,247,.3)}
.badge-d3{background:rgba(52,211,153,.15);color:var(--d3);border:1px solid rgba(52,211,153,.3)}
.badge-d4{background:rgba(167,139,250,.15);color:var(--d4);border:1px solid rgba(167,139,250,.3)}
.badge-mc{background:rgba(255,153,0,.1);color:var(--accent);border:1px solid rgba(255,153,0,.25)}
.badge-mr{background:rgba(255,184,77,.1);color:var(--accent2);border:1px solid rgba(255,184,77,.25)}
.qtext{font-size:14px;color:var(--text);line-height:1.6;flex:1}
.chevron{color:var(--muted);font-size:16px;transition:transform .2s;padding-top:2px;min-width:16px}
.qcard.open .chevron{transform:rotate(180deg)}
.qcard-body{display:none;border-top:1px solid var(--border)}
.qcard.open .qcard-body{display:block}
.options{padding:14px 18px 0;display:flex;flex-direction:column;gap:6px}
.opt{border:1px solid var(--border);border-radius:6px;padding:10px 14px;display:flex;gap:10px;cursor:pointer;transition:all .15s;align-items:flex-start}
.opt:hover{border-color:var(--border-bright);background:var(--surface2)}
.opt.selected{border-color:var(--accent);background:rgba(255,153,0,.08)}
.opt.rev-correct{border-color:var(--correct);background:rgba(34,197,94,.08);cursor:default}
.opt.rev-wrong{border-color:var(--wrong);background:rgba(239,68,68,.06);cursor:default}
.opt-label{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);min-width:18px;padding-top:1px}
.opt.rev-correct .opt-label{color:var(--correct)}
.opt.rev-wrong .opt-label{color:var(--wrong)}
.opt-text{font-size:14px;color:var(--text);line-height:1.5}
.reveal-wrap{padding:14px 18px}
.reveal-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:8px 18px;border-radius:5px;font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .15s;width:100%}
.reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
.reveal-btn.done{opacity:.5;cursor:default}
.explanation{display:none;padding:0 18px 18px}
.qcard.revealed .explanation{display:block}
.exp-header{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:10px;padding-top:14px;border-top:1px solid var(--border)}
.exp-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.exp-opt{display:flex;gap:10px;padding:8px 12px;border-radius:5px;font-size:13px;line-height:1.5;align-items:flex-start}
.exp-opt.correct{background:rgba(34,197,94,.08);border-left:2px solid var(--correct)}
.exp-opt.wrong{background:rgba(239,68,68,.06);border-left:2px solid rgba(239,68,68,.3)}
.exp-lbl{font-family:var(--mono);font-size:12px;font-weight:600;min-width:18px}
.exp-opt.correct .exp-lbl{color:var(--correct)}
.exp-opt.wrong .exp-lbl{color:var(--wrong)}
.exp-text{color:var(--muted)}
.exp-text strong{color:var(--text)}
.key-rule{background:rgba(255,153,0,.07);border:1px solid rgba(255,153,0,.2);border-radius:5px;padding:8px 12px;font-size:12px;color:var(--accent2);font-family:var(--mono);line-height:1.5}
.empty{text-align:center;padding:60px 24px;color:var(--muted);font-size:14px;display:none}
#scrolltop{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;opacity:0;pointer-events:none}
#scrolltop.visible{opacity:1;pointer-events:auto}
#scrolltop:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">SAA-C03</div>
  <div class="header-sep"></div>
  <div class="header-title">Practice Exam &middot; 65 Questions</div>
  <div class="score-pill" id="scorePill">0 correct &middot; 0 answered</div>
</div>
<div class="controls">
  <button class="filter-btn active" onclick="filter('all',this)">All (65)</button>
  <button class="filter-btn d1" onclick="filter('1',this)">Domain 1 &mdash; Secure (30%)</button>
  <button class="filter-btn d2" onclick="filter('2',this)">Domain 2 &mdash; Resilient (26%)</button>
  <button class="filter-btn d3" onclick="filter('3',this)">Domain 3 &mdash; High-Performing (24%)</button>
  <button class="filter-btn d4" onclick="filter('4',this)">Domain 4 &mdash; Cost-Optimized (20%)</button>
  <div class="controls-right">
    <button class="action-btn" onclick="resetAll()">Reset</button>
    <button class="action-btn" onclick="revealAll()">Reveal all</button>
    <button class="action-btn primary" onclick="shuffleQuestions()">&#x21C4; Shuffle</button>
  </div>
</div>

  <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>

</div>

  <div class="empty" id="emptyMsg">No questions match this filter.</div>
