<script>
const Q=[
// ── DOMAIN 1: SECURE (20 Qs) ────────────────────────────────────────────────
{n:1,d:1,t:'mc',stem:'A company has multiple AWS accounts managed under AWS Organizations. The security team wants to prevent any IAM user or role in any member account from disabling AWS CloudTrail, even administrators. Which solution meets this requirement?',opts:{A:'Create an IAM policy in each account that denies cloudtrail:StopLogging and attach it to all roles.',B:'Enable AWS Config in each account with a rule that detects when CloudTrail is disabled.',C:'Create a Service Control Policy (SCP) that denies cloudtrail:StopLogging and attach it to the root OU.',D:'Use CloudFormation StackSets to deploy a Lambda function that re-enables CloudTrail when stopped.'},correct:['C'],exp:{A:'IAM policies can be overridden by an admin — they cannot enforce a hard floor across accounts.',B:'Config is a detective control. It detects the change after it happens; it does not prevent it.',C:'SCPs are preventive controls at the Organizations level. Attached to the root OU they apply to all member accounts and no IAM principal can override them, not even administrators.',D:'Lambda re-enablement is reactive, not preventive. There is a window where CloudTrail is disabled.'},rule:'SCPs = preventive guardrails no IAM principal in member accounts can override. "Prevent even admins" = SCP.'},
{n:2,d:1,t:'mc',stem:'A solutions architect needs to grant an EC2 instance in Account A access to an S3 bucket in Account B. What is the MOST secure and operationally efficient approach?',opts:{A:'Create an IAM user in Account B, generate access keys, and store them in the EC2 instance user data.',B:'Create an IAM role in Account B with S3 read permissions and a trust policy allowing Account A\'s EC2 role to assume it. Assign an instance profile to the EC2 instance.',C:'Make the S3 bucket public and restrict access by IP address.',D:'Create an IAM user in Account A and attach a policy that grants cross-account S3 access.'},correct:['B'],exp:{A:'Storing credentials in user data is a critical security anti-pattern — visible in plaintext via the metadata service.',B:'Correct cross-account pattern: IAM role in target account with trust policy for source account role. EC2 uses its instance profile to assume the cross-account role via STS. No long-lived credentials.',C:'Public buckets expose data to the entire internet.',D:'IAM users in Account A cannot directly access Account B resources without cross-account trust on the target side.'},rule:'Cross-account access = IAM role in target account + trust policy + STS AssumeRole. Never store credentials on EC2.'},
{n:3,d:1,t:'mr',stem:'A company wants to enforce least privilege. A junior administrator should be able to create IAM roles but only with a maximum permission set defined by the security team — they must not grant more permissions than they themselves have. Which TWO actions accomplish this? (Choose TWO)',opts:{A:'Attach a permissions boundary to the junior administrator that limits what permissions they can grant.',B:'Use an SCP to restrict the junior administrator from calling iam:CreateRole.',C:'Require the junior administrator to attach a specific permissions boundary to every role they create, enforced via an IAM condition (iam:PermissionsBoundary).',D:'Enable AWS Config to monitor newly created roles for excessive permissions.',E:'Assign the junior administrator to an OU with a restrictive SCP.'},correct:['A','C'],exp:{A:'Permissions boundaries cap what a principal can do. The junior admin cannot grant permissions outside their own boundary.',B:'Denying iam:CreateRole entirely would prevent them from doing their job — not the goal.',C:'IAM condition key iam:PermissionsBoundary requires that any role created must have a specific boundary attached. The admin cannot skip it.',D:'Config is detective only — roles with excessive permissions could exist before detection.',E:'SCPs apply to accounts/OUs, not individual IAM users within an account.'},rule:'Delegated role creation without privilege escalation = permissions boundary on the admin + IAM condition requiring boundary on roles they create.'},
{n:4,d:1,t:'mc',stem:'A company needs all new AWS accounts provisioned for development teams to automatically have baseline security controls (Config, CloudTrail, GuardDuty) enabled with no ability for teams to disable them. Which AWS service best automates this?',opts:{A:'AWS Service Catalog',B:'AWS CloudFormation StackSets',C:'AWS Control Tower',D:'AWS Systems Manager'},correct:['C'],exp:{A:'Service Catalog manages approved products — it does not govern accounts at the Organizations level.',B:'StackSets can deploy Config/CloudTrail/GuardDuty but cannot prevent teams from disabling them. No preventive control.',C:'Control Tower automates multi-account setup with mandatory guardrails (preventive via SCPs, detective via Config). Every new account automatically has baseline controls that cannot be disabled by the account owner.',D:'Systems Manager handles operational tasks on running resources, not account governance.'},rule:'"New accounts automatically compliant, cannot disable controls" = Control Tower.'},
{n:5,d:1,t:'mc',stem:'A web application allows users to sign in with Google or Facebook and then access application AWS resources (DynamoDB, S3). Which combination of services should the architect use?',opts:{A:'IAM users + IAM Identity Center',B:'Amazon Cognito User Pool + Amazon Cognito Identity Pool',C:'AWS Directory Service + IAM roles',D:'Amazon Cognito User Pool only'},correct:['B'],exp:{A:'IAM users are for internal workforce accounts, not consumer application users.',B:'Cognito User Pool handles authentication (including social identity federation) and issues JWTs. Cognito Identity Pool exchanges those JWTs for temporary AWS credentials to access DynamoDB and S3. This is the canonical pattern.',C:'Directory Service integrates with on-premises Active Directory, not consumer social identity providers.',D:'User Pool alone issues JWTs but does not provide AWS credentials to access resources.'},rule:'Consumer app + social login + AWS resource access = Cognito User Pool (auth) + Cognito Identity Pool (AWS credentials).'},
{n:6,d:1,t:'mc',stem:'An IAM policy denies all actions when the condition BoolIfExists: aws:MultiFactorAuthPresent is false. What does this policy do?',opts:{A:'Allows all actions only when MFA is present.',B:'Denies all actions when the request is made without MFA, effectively requiring MFA for any operation.',C:'Denies all actions unconditionally.',D:'Allows all actions except those requiring MFA.'},correct:['B'],exp:{A:'The policy\'s Effect is Deny, not Allow.',B:'BoolIfExists: aws:MultiFactorAuthPresent: false means "if the MFA key exists and is false" — i.e., authenticated without MFA. The deny fires for non-MFA sessions. Combined with an allow policy this enforces MFA.',C:'The condition gates the deny — it only fires when MFA is absent, not unconditionally.',D:'The logic is inverted — this denies when MFA is absent, not present.'},rule:'MFA enforcement in IAM is always deny-based: Deny all actions when MFA absent. Never allow-based.'},
{n:7,d:1,t:'mc',stem:'A company uses IAM Identity Center for employee access to multiple AWS accounts. A new requirement mandates all access must be federated through the company\'s existing on-premises Microsoft Active Directory. What should the architect configure?',opts:{A:'Create IAM users in each account that mirror Active Directory accounts.',B:'Use AWS Directory Service AD Connector to connect IAM Identity Center to the on-premises AD.',C:'Configure IAM Identity Center to use AWS Managed Microsoft AD and sync users manually.',D:'Deploy an EC2-based ADFS server and configure SAML federation with each AWS account directly.'},correct:['B'],exp:{A:'Creating IAM users is manual, does not federate, and does not scale.',B:'AD Connector is a proxy that redirects authentication to the on-premises AD without caching credentials in AWS. Pairing it with IAM Identity Center lets employees log in with existing AD credentials across all AWS accounts.',C:'Managed Microsoft AD creates a new AD in AWS — it does not federate with an existing on-premises AD natively.',D:'ADFS + SAML per account is the legacy approach. IAM Identity Center with AD Connector is simpler and centrally managed.'},rule:'"Federate existing on-prem AD with multiple AWS accounts" = AD Connector + IAM Identity Center.'},
{n:8,d:1,t:'mc',stem:'A company wants to restrict EC2 instances in a member account from being launched outside us-east-1 and eu-west-1. The restriction must apply even to the account root user. What is the correct approach?',opts:{A:'Create an IAM policy with Deny on ec2:RunInstances with a Condition on aws:RequestedRegion and attach it to all users.',B:'Create an SCP with a Deny on ec2:RunInstances using StringNotEquals on aws:RequestedRegion for the two allowed regions.',C:'Enable AWS Config with a rule that terminates EC2 instances launched outside approved regions.',D:'Use IAM permission boundaries on all roles.'},correct:['B'],exp:{A:'IAM policies cannot restrict the root user. SCPs are required for account-wide enforcement including root.',B:'SCPs apply to all principals including root (except the management account). StringNotEquals on aws:RequestedRegion with allowed regions denies RunInstances in all other regions.',C:'Config is detective — it detects after launch. Cannot prevent the launch.',D:'Permission boundaries apply to individual roles/users, not the root user.'},rule:'Restrict regions for ALL principals including root = SCP. Remember: management account is never affected by SCPs.'},
{n:9,d:1,t:'mc',stem:'A company stores sensitive customer data in S3. The security team needs to know exactly which IAM principal decrypted a specific object and when. Which combination of features provides this?',opts:{A:'S3 server access logging + SSE-S3',B:'AWS CloudTrail + SSE-KMS',C:'Amazon Macie + AWS Config',D:'CloudTrail + S3 server access logging + SSE-S3'},correct:['B'],exp:{A:'SSE-S3 uses AWS-managed keys with no audit trail for individual decrypt operations.',B:'SSE-KMS encrypts objects with a KMS CMK. Every decrypt requires a KMS API call (GenerateDataKey or Decrypt), and CloudTrail records every KMS API call with the caller identity and timestamp.',C:'Macie classifies sensitive data — it does not log who decrypted what.',D:'SSE-S3 does not produce KMS audit events. Cannot trace individual decryptions.'},rule:'"Who decrypted what and when" = SSE-KMS + CloudTrail. Every KMS call is logged with caller identity.'},
{n:10,d:1,t:'mc',stem:'A financial services company must ensure S3 objects in a compliance bucket cannot be deleted for 7 years, even by the bucket owner or AWS. Which S3 feature satisfies this?',opts:{A:'S3 Versioning with MFA Delete enabled',B:'S3 Object Lock in Governance mode',C:'S3 Object Lock in Compliance mode',D:'S3 Bucket Policy with explicit Deny on s3:DeleteObject'},correct:['C'],exp:{A:'MFA Delete requires MFA to delete versions, but a user with the MFA device can still delete objects.',B:'Governance mode protects objects but allows users with s3:BypassGovernanceRetention permission to override it.',C:'Compliance mode is truly immutable — no user, including the bucket owner or AWS root, can delete or alter the object before the retention period expires. Correct for regulatory WORM requirements.',D:'Bucket policies can be modified by an account administrator and are not immutable.'},rule:'Immutable, cannot-be-overridden retention = S3 Object Lock Compliance mode. Governance mode = can bypass with permission.'},
{n:11,d:1,t:'mc',stem:'A web application behind an ALB needs protection against SQL injection and cross-site scripting attacks. Which service should be deployed?',opts:{A:'AWS Shield Advanced',B:'Amazon GuardDuty',C:'AWS WAF',D:'AWS Network Firewall'},correct:['C'],exp:{A:'Shield Advanced protects against DDoS (volumetric, Layer 3/4). It does not inspect HTTP payloads for SQLi or XSS.',B:'GuardDuty analyzes VPC Flow Logs, CloudTrail, and DNS logs for threats. It does not inspect application-layer HTTP traffic.',C:'WAF operates at Layer 7 and inspects HTTP/HTTPS request contents. It blocks requests with SQL injection patterns, XSS payloads, and OWASP Top 10 attack vectors.',D:'Network Firewall operates at the network/transport layer — not for HTTP application-layer content filtering.'},rule:'SQL injection, XSS, OWASP Top 10 = WAF. Attach to ALB, CloudFront, or API Gateway.'},
{n:12,d:1,t:'mr',stem:'A company wants all S3 data encrypted with keys they fully control, with full audit logging of every encryption/decryption, and automatic annual key rotation. Which TWO steps are required? (Choose TWO)',opts:{A:'Enable SSE-S3 as the default encryption for the S3 bucket.',B:'Create a Customer Managed Key (CMK) in AWS KMS and enable automatic key rotation.',C:'Configure the S3 bucket to use SSE-KMS with the customer managed CMK.',D:'Enable Amazon Macie on the S3 bucket.',E:'Use AWS CloudHSM to store all encryption keys.'},correct:['B','C'],exp:{A:'SSE-S3 uses AWS-managed keys (company does not fully control them) and provides no per-operation audit logging.',B:'Customer Managed CMKs give full control over the key policy, support automatic annual rotation, and all usage is logged by CloudTrail.',C:'Setting the bucket to SSE-KMS with the CMK ensures every object is encrypted with the company-controlled key and every decrypt triggers a logged KMS API call.',D:'Macie discovers sensitive data — it has nothing to do with encryption or key management.',E:'CloudHSM does not have native S3 integration for object encryption. KMS CMK is the correct tool.'},rule:'Company-controlled encryption + audit logs + automatic rotation = CMK in KMS + SSE-KMS on the bucket.'},
{n:13,d:1,t:'mc',stem:'A company needs secure operational access to EC2 instances in private subnets. No inbound ports should be open on security groups, and all session activity must be logged. What is the recommended approach?',opts:{A:'Deploy a bastion host in a public subnet and allow SSH from trusted IP ranges.',B:'Use AWS Systems Manager Session Manager with IAM permissions and CloudWatch/S3 session logging.',C:'Create a VPN connection and open SSH only from the VPN CIDR block.',D:'Use EC2 Instance Connect.'},correct:['B'],exp:{A:'Bastion hosts require opening port 22 inbound and managing SSH keys. Does not meet the no-open-ports requirement.',B:'Session Manager establishes sessions through the SSM agent without any inbound ports. Sessions are fully logged to CloudWatch Logs or S3. IAM policies control who can start sessions.',C:'VPN still requires an open SSH port — it only restricts the source.',D:'EC2 Instance Connect still uses SSH (port 22) — the port must be open.'},rule:'"No open ports + auditable shell access" = Systems Manager Session Manager. Zero inbound rules required.'},
{n:14,d:1,t:'mc',stem:'A company uses Amazon RDS for MySQL. Database passwords are hardcoded in environment variables. The company wants centralized credential management with automatic rotation on a 30-day schedule. Which service should the architect recommend?',opts:{A:'AWS Systems Manager Parameter Store (SecureString)',B:'AWS Secrets Manager',C:'AWS KMS with application-level encryption',D:'AWS Certificate Manager'},correct:['B'],exp:{A:'Parameter Store SecureString encrypts values using KMS but does NOT support automatic rotation natively.',B:'Secrets Manager is purpose-built for managing secrets with native automatic rotation for RDS MySQL, PostgreSQL, Aurora, etc. It rotates the actual database password and updates the secret automatically.',C:'KMS is for encryption key management, not for storing and rotating database credentials.',D:'ACM manages TLS/SSL certificates, not database credentials.'},rule:'"Automatic rotation of database credentials" = Secrets Manager. Parameter Store = config/secrets without native rotation.'},
{n:15,d:1,t:'mc',stem:'A company stores sensitive customer PII in multiple S3 buckets. The security team wants to automatically discover which buckets contain PII and receive alerts. Which service provides this?',opts:{A:'Amazon GuardDuty',B:'Amazon Inspector',C:'Amazon Macie',D:'AWS Config'},correct:['C'],exp:{A:'GuardDuty detects threats and malicious activity — it does not classify data content in S3 objects.',B:'Inspector scans EC2 instances and container images for software vulnerabilities — not S3 object content.',C:'Macie uses ML to discover, classify, and protect sensitive data in S3. It specifically identifies PII, financial data, and other sensitive content.',D:'Config tracks resource configuration changes — it does not inspect S3 object content for PII.'},rule:'"Find PII in S3" = Amazon Macie. GuardDuty = threat detection. Inspector = vulnerability scanning.'},
{n:16,d:1,t:'mc',stem:'A company experiences volumetric DDoS attacks and wants 24/7 access to AWS DDoS experts and cost protection for scaling costs incurred during an attack. Which service should they enable?',opts:{A:'AWS WAF with rate-based rules',B:'AWS Shield Standard',C:'AWS Shield Advanced',D:'Amazon CloudFront with geo-restriction'},correct:['C'],exp:{A:'WAF rate-based rules protect against Layer 7 HTTP floods, not volumetric network-layer attacks.',B:'Shield Standard is free and automatically protects against common Layer 3/4 attacks but does not provide DRT access or cost protection.',C:'Shield Advanced provides enhanced mitigation for large volumetric attacks, 24/7 access to the AWS DRT, and cost protection (AWS credits scaling costs incurred due to a DDoS attack).',D:'CloudFront geo-restriction blocks traffic by country — does not provide DRT access or cost protection.'},rule:'Shield Advanced = large DDoS + DRT access + cost protection. "DRT" or "cost protection for DDoS" always points to Shield Advanced.'},
{n:17,d:1,t:'mc',stem:'A company needs to encrypt HTTPS traffic and terminate TLS at the Application Load Balancer. Where should the TLS certificate be installed?',opts:{A:'On each EC2 instance behind the ALB.',B:'In AWS Certificate Manager and associated with the ALB listener.',C:'In AWS KMS and referenced by the ALB.',D:'Directly on the ALB using a self-signed certificate uploaded to IAM.'},correct:['B'],exp:{A:'Installing certificates on EC2 instances would terminate TLS at the instance, not the load balancer.',B:'ACM manages TLS certificates and handles automatic renewal. Associating the ACM certificate with the ALB HTTPS listener is the standard pattern for SSL termination at the load balancer.',C:'KMS is for encryption key management, not TLS certificate hosting for load balancers.',D:'IAM certificate storage is a legacy mechanism. ACM is the current recommended service with automatic renewal.'},rule:'TLS termination at ALB = ACM certificate attached to ALB HTTPS listener.'},
{n:18,d:1,t:'mc',stem:'A private subnet application must access AWS API endpoints (KMS and Secrets Manager) without routing traffic through the public internet. What is the correct solution?',opts:{A:'Deploy a NAT Gateway in a public subnet and route traffic through it.',B:'Create a VPC Gateway Endpoint for KMS and Secrets Manager.',C:'Create VPC Interface Endpoints (PrivateLink) for KMS and Secrets Manager.',D:'Configure a Site-to-Site VPN to route AWS API traffic back on-premises.'},correct:['C'],exp:{A:'NAT Gateway routes traffic to the internet and back — does not keep traffic within AWS private network.',B:'Gateway Endpoints only support S3 and DynamoDB. KMS and Secrets Manager are not supported by Gateway Endpoints.',C:'Interface Endpoints (PrivateLink) create an ENI in your VPC subnet with a private IP. Traffic to KMS and Secrets Manager routes privately through the AWS backbone without touching the internet.',D:'VPN routing adds unnecessary complexity and latency for this use case.'},rule:'Private access to AWS services: S3/DynamoDB = Gateway Endpoint (free). All other services = Interface Endpoint (PrivateLink, costs money).'},
{n:19,d:1,t:'mc',stem:'A company needs FIPS 140-2 Level 3 validated hardware security for cryptographic keys. AWS must have no access to the key material. Which service meets this?',opts:{A:'AWS KMS with Customer Managed Keys',B:'AWS KMS with AWS-managed keys',C:'AWS CloudHSM',D:'AWS Secrets Manager with CMK encryption'},correct:['C'],exp:{A:'KMS CMKs are stored in shared HSM infrastructure validated to FIPS 140-2 Level 2. AWS has access to the underlying hardware.',B:'AWS-managed keys give the customer even less control.',C:'CloudHSM provides dedicated, single-tenant hardware validated to FIPS 140-2 Level 3. The customer manages keys entirely — AWS has no access to key material.',D:'Secrets Manager stores secrets encrypted by KMS. It is not an HSM.'},rule:'FIPS 140-2 Level 3 + dedicated HSM + AWS has no access = CloudHSM. KMS = Level 2, shared hardware.'},
{n:20,d:1,t:'mc',stem:'A company wants to track and evaluate the compliance of AWS resource configurations across all accounts (e.g., all EBS volumes encrypted, all S3 buckets block public access). Which service should they use?',opts:{A:'Amazon GuardDuty',B:'AWS CloudTrail',C:'AWS Config',D:'AWS Security Hub'},correct:['C'],exp:{A:'GuardDuty detects security threats — it does not evaluate resource configuration compliance rules.',B:'CloudTrail logs API calls — it is an audit trail, not a configuration compliance tool.',C:'AWS Config continuously tracks resource configurations and evaluates them against desired rules. It provides a compliance dashboard and can trigger remediation.',D:'Security Hub aggregates findings from multiple security services — it is an aggregator, not the source of configuration compliance evaluation.'},rule:'"Configuration compliance rules, evaluate resources" = AWS Config. Security Hub aggregates Config findings and others.'},

// ── DOMAIN 2: RESILIENT (17 Qs) ─────────────────────────────────────────────
{n:21,d:2,t:'mc',stem:'A company processes orders. Order processing must not lose any messages even if the processing service is temporarily unavailable, and each order must be processed exactly once. Which solution meets these requirements?',opts:{A:'Amazon SNS with a subscription to the processing service.',B:'Amazon SQS Standard queue.',C:'Amazon SQS FIFO queue with message deduplication enabled.',D:'Amazon Kinesis Data Streams.'},correct:['C'],exp:{A:'SNS is push-based — if the subscriber is unavailable when SNS delivers, the message is lost.',B:'SQS Standard provides at-least-once delivery (possible duplicates) and best-effort ordering. Duplicate processing could corrupt order state.',C:'SQS FIFO with deduplication provides exactly-once processing and strict ordering. Messages are retained if the consumer is down (up to 14 days).',D:'Kinesis provides ordering and replay within a shard but does not natively prevent duplicate processing without consumer-side idempotency logic.'},rule:'"Exactly once + ordered + no message loss" = SQS FIFO. Standard SQS = at-least-once. SNS = no buffer, push only.'},
{n:22,d:2,t:'mc',stem:'A company wants to decouple a web tier from a processing tier so traffic spikes do not cause the processing service to fail. Processing jobs can tolerate some delay. What is the best architectural approach?',opts:{A:'Add more EC2 instances to the processing tier using vertical scaling.',B:'Place an Amazon SQS queue between the tiers. The web tier enqueues jobs; processing tier workers poll and scale based on queue depth.',C:'Deploy an Application Load Balancer between the tiers.',D:'Use Amazon CloudFront to cache responses from the processing tier.'},correct:['B'],exp:{A:'Vertical scaling has limits, requires downtime for resizing, and does not decouple the tiers.',B:'SQS acts as a buffer. The web tier enqueues immediately and returns. The processing tier pulls from the queue at its own pace, scaling on ApproximateNumberOfMessagesVisible.',C:'An ALB load-balances between instances of the same tier — it does not buffer asynchronous workloads.',D:'CloudFront caches static content — it does not buffer processing jobs.'},rule:'Decouple tiers + absorb spikes + async processing = SQS between tiers. Scale consumers on queue depth.'},
{n:23,d:2,t:'mc',stem:'An application needs to notify multiple different systems (email, inventory, analytics) whenever a new order is created. What is the most efficient architectural pattern?',opts:{A:'The order service directly calls each downstream system sequentially.',B:'The order service writes to an SQS queue; each system polls the same queue.',C:'The order service publishes to an SNS topic; each downstream system subscribes with its own SQS queue (fan-out pattern).',D:'The order service writes events to a DynamoDB table; each system polls for new records.'},correct:['C'],exp:{A:'Sequential direct calls create tight coupling. If any downstream is slow or fails, the order service is blocked.',B:'A single SQS queue delivers each message to only one consumer — all systems would compete for the same messages.',C:'SNS fan-out: one publish notifies all subscribers simultaneously. Each system has its own SQS queue for buffering and independent processing.',D:'DynamoDB polling is an anti-pattern — creates database load and adds complexity.'},rule:'One event to multiple independent systems = SNS fan-out + SQS queues per subscriber.'},
{n:24,d:2,t:'mc',stem:'A company requires DR in us-west-2 with RTO under 15 minutes and RPO under 5 minutes. Which DR strategy meets these requirements at the lowest cost?',opts:{A:'Backup and Restore — hourly snapshots stored in S3 in us-west-2.',B:'Pilot Light — replicate the database to us-west-2 in real-time; keep other resources stopped.',C:'Warm Standby — run a scaled-down fully functional stack in us-west-2 at all times.',D:'Active-Active — run full capacity in both regions simultaneously.'},correct:['C'],exp:{A:'Backup and Restore RTO is hours (time to restore and spin up infrastructure). Cannot meet 15-minute RTO.',B:'Pilot Light has only the DB running. Spinning up remaining infrastructure from scratch takes 20-45+ minutes — may not meet 15-min RTO.',C:'Warm Standby runs a scaled-down but operational full stack. Failover requires only DNS update and scale-up — achievable in minutes. RPO is near-zero with synchronous replication.',D:'Active-Active easily meets RTO/RPO but is the most expensive option. Warm Standby meets the requirements at lower cost.'},rule:'RTO < 15 min, RPO < 5 min at lowest cost = Warm Standby. Active-Active meets it too but costs more.'},
{n:25,d:2,t:'mc',stem:'An application uses RDS MySQL Multi-AZ. A reporting job is running heavy queries against the primary database, degrading read performance. How should this be resolved without impacting the primary workload?',opts:{A:'Upgrade the RDS instance to a larger instance type.',B:'Enable automated backups — backups offload reads to the standby.',C:'Create an RDS Read Replica and direct the reporting job to the replica endpoint.',D:'Increase the Multi-AZ standby to accept read traffic.'},correct:['C'],exp:{A:'Vertical scaling is expensive, requires a brief failover, and does not architecturally separate the reporting workload.',B:'Automated backups use the standby for snapshots in Multi-AZ, but the standby is not accessible for queries.',C:'Read Replicas are asynchronous copies designed for read offloading. The reporting job connects to the replica endpoint, removing load from the primary.',D:'The Multi-AZ standby is not accessible for reads — it is exclusively for automatic failover. Common exam distractor.'},rule:'Multi-AZ standby = failover only, NOT readable. Read Replica = readable copy for offloading reads.'},
{n:26,d:2,t:'mr',stem:'After a regional outage, the board mandated the application must be available in a second region within 10 minutes, with no more than 1 minute of data loss. Which TWO steps should the architect take? (Choose TWO)',opts:{A:'Create an AMI of EC2 instances and copy it to the secondary region.',B:'Use Amazon Route 53 with a Failover routing policy and health checks pointing to the primary region ALB.',C:'Set up an Aurora Global Database with primary in the primary region and secondary in the backup region.',D:'Enable S3 Cross-Region Replication for all application data.',E:'Use AWS Backup to take hourly snapshots of EBS volumes.'},correct:['B','C'],exp:{A:'AMI copies are useful but do not provide automated failover or 10-minute RTO without additional orchestration.',B:'Route 53 Failover routing with health checks automatically redirects traffic to the secondary region when primary health check fails. This is the DNS-layer failover mechanism.',C:'Aurora Global Database replicates with typically less than 1 second lag (meeting 1-minute RPO) and can promote the secondary cluster in under 1 minute (meeting 10-minute RTO).',D:'S3 CRR replicates objects but does not handle database failover — which is the primary requirement.',E:'Hourly EBS snapshots allow up to 60 minutes of data loss — far exceeding the 1-minute RPO.'},rule:'Multi-region HA = Route 53 Failover routing (DNS) + Aurora Global Database (data). Aurora Global = <1s RPO, <1min RTO.'},
{n:27,d:2,t:'mc',stem:'A Lambda function processes messages from an SQS queue and writes results to RDS. During peak load the function fails with "too many connections" errors from RDS. What is the most operationally efficient solution?',opts:{A:'Increase the RDS instance size to support more connections.',B:'Add an ElastiCache layer between Lambda and RDS.',C:'Use Amazon RDS Proxy between Lambda and RDS.',D:'Reduce Lambda concurrency limits to reduce simultaneous executions.'},correct:['C'],exp:{A:'Larger RDS instances support more connections, but Lambda scales to thousands of concurrent executions — the connection exhaustion problem persists.',B:'ElastiCache is for caching reads, not for managing database connection pooling.',C:'RDS Proxy maintains a pool of connections to RDS and multiplexes Lambda invocations over the pool. Lambda connects to the proxy, which keeps connections alive. Eliminates connection exhaustion.',D:'Reducing Lambda concurrency limits throughput — it addresses the symptom by throttling, not fixing the architecture.'},rule:'"Lambda + RDS connection exhaustion / too many connections" = RDS Proxy.'},
{n:28,d:2,t:'mc',stem:'A company wants to replace failed instances with new instances built from the latest AMI, rather than patching running instances. Which deployment practice does this describe?',opts:{A:'Blue/green deployment',B:'Immutable infrastructure',C:'In-place deployment',D:'Canary deployment'},correct:['B'],exp:{A:'Blue/green swaps traffic between two environments — it is a deployment strategy, not specifically about instance lifecycle.',B:'Immutable infrastructure: instances are never patched after launch. Updates launch new instances from a fresh AMI; old ones are terminated. Eliminates configuration drift.',C:'In-place deployment updates software on existing running instances — the opposite of immutable.',D:'Canary deploys a small percentage of traffic to a new version — a traffic-management strategy.'},rule:'"Never patch running instances, replace with new AMI" = Immutable infrastructure.'},
{n:29,d:2,t:'mc',stem:'A company wants to route global users to the AWS region with the lowest network latency from the user\'s location. Which Route 53 routing policy should they use?',opts:{A:'Weighted routing',B:'Geolocation routing',C:'Latency-based routing',D:'Geoproximity routing'},correct:['C'],exp:{A:'Weighted routing splits traffic by percentage — for A/B testing or canary releases, not latency optimization.',B:'Geolocation routes based on the geographic location of the user — enforces data residency, not minimum latency.',C:'Latency-based routing measures actual network latency from the user to each region and routes to the lowest-latency endpoint.',D:'Geoproximity routes based on physical distance with optional bias — approximates latency routing but not based on actual latency measurement.'},rule:'"Route to lowest latency region" = Latency-based routing. Geolocation = data residency. Weighted = traffic split percentage.'},
{n:30,d:2,t:'mc',stem:'A performance engineer cannot identify which service in a microservices call chain is causing high latency. Which AWS service helps identify the bottleneck?',opts:{A:'Amazon CloudWatch Logs',B:'AWS X-Ray',C:'Amazon GuardDuty',D:'AWS Config'},correct:['B'],exp:{A:'CloudWatch Logs stores application and infrastructure logs — useful for individual services but does not show end-to-end request traces across multiple services.',B:'X-Ray provides distributed tracing. It maps the full path of a request across all microservices, showing latency at each step and identifying the bottleneck.',C:'GuardDuty is a security threat detection service — unrelated to application performance analysis.',D:'Config tracks AWS resource configuration changes — not application-level performance tracing.'},rule:'"Trace request across microservices, identify bottleneck" = AWS X-Ray.'},
{n:31,d:2,t:'mc',stem:'An application requires a workflow that coordinates multiple Lambda functions with error handling, retries, and both sequential and parallel execution. What is the correct service for orchestrating this?',opts:{A:'Amazon SQS with multiple queues',B:'Amazon SNS with Lambda subscriptions',C:'AWS Step Functions',D:'Amazon EventBridge with scheduled rules'},correct:['C'],exp:{A:'SQS queues messages — significant custom code would be needed for sequential vs parallel logic, error handling, and state tracking.',B:'SNS triggers Lambda via subscriptions but does not manage workflow state, sequential steps, or retry logic across steps.',C:'Step Functions is a serverless workflow orchestration service that natively supports sequential steps, parallel branches, catch/retry error handling, and state visibility — no orchestration code required.',D:'EventBridge schedules or routes events — it is not designed for stateful multi-step workflow coordination.'},rule:'"Orchestrate Lambda, sequential + parallel, retry logic, state machine" = AWS Step Functions.'},
{n:32,d:2,t:'mc',stem:'An e-commerce application stores product images in S3 and serves them globally. Page load times for international users are slow due to latency fetching images from the origin S3 bucket. What is the most effective solution?',opts:{A:'Enable S3 Transfer Acceleration on the bucket.',B:'Deploy an Amazon CloudFront distribution in front of the S3 bucket.',C:'Copy the S3 bucket to multiple regions using Cross-Region Replication.',D:'Use an Application Load Balancer in each region to serve the images.'},correct:['B'],exp:{A:'S3 Transfer Acceleration speeds up uploads from clients to S3 using CloudFront edge locations — it optimizes uploads, not downloads to end users.',B:'CloudFront caches content at 400+ edge locations worldwide. International users fetch images from the nearest edge location. First request goes to origin; subsequent requests served from cache.',C:'CRR replicates to a small number of regions and requires complex routing logic. CloudFront automatically routes to the nearest PoP.',D:'ALBs do not cache content. Running ALBs in every region is expensive and complex.'},rule:'"Global users, slow latency, static content" = CloudFront CDN. Transfer Acceleration = fast uploads to S3, not downloads to users.'},
{n:33,d:2,t:'mc',stem:'A stateless web app runs on EC2 in an ASG behind an ALB. During business hours load is consistently high; overnight load drops to near zero. Which scaling strategy is most appropriate?',opts:{A:'Simple scaling — add instances when CPU exceeds 70%.',B:'Target tracking scaling — maintain 70% average CPU.',C:'Scheduled scaling — scale out before business hours, scale in at night, combined with target tracking during the day.',D:'Manual scaling — set desired capacity each morning and evening.'},correct:['C'],exp:{A:'Simple scaling is reactive — there is always a delay between load increasing and instances coming online, causing performance dips.',B:'Target tracking is reactive — it waits for load to arrive before adding instances. Warm-up lag at the start of business hours.',C:'Scheduled scaling proactively adds capacity before business hours, eliminating warm-up lag. Target tracking handles unexpected intra-day spikes. Combined, optimal for predictable cyclical patterns.',D:'Manual scaling requires human intervention twice daily and is error-prone.'},rule:'Predictable cyclical load = Scheduled scaling (proactive) + Target Tracking (handles unexpected spikes).'},
{n:34,d:2,t:'mc',stem:'A company wants to expose each microservice through a single managed API endpoint with authentication, throttling, and request routing. Which service should they use?',opts:{A:'Application Load Balancer with host-based routing',B:'AWS API Gateway',C:'Amazon CloudFront with Lambda@Edge',D:'AWS AppSync'},correct:['B'],exp:{A:'ALB provides routing but does not natively provide throttling, API keys, usage plans, or request/response transformation.',B:'API Gateway is a fully managed API layer providing routing, authentication (Cognito, IAM, Lambda authorizers), throttling, rate limiting, caching, and SDK generation.',C:'CloudFront + Lambda@Edge is for edge-side request processing and content delivery — not API management with auth and throttling.',D:'AppSync is a managed GraphQL service — specifically for GraphQL APIs, not general REST microservice routing.'},rule:'"Managed API endpoint + auth + throttling + routing" = API Gateway.'},
{n:35,d:2,t:'mc',stem:'A company runs a critical database on EC2. The application requires the database to be available with RTO under 2 minutes in case of instance failure. Which solution meets this requirement?',opts:{A:'Take daily EBS snapshots and restore them if the instance fails.',B:'Use Amazon RDS Multi-AZ instead of an EC2-hosted database.',C:'Use an EC2 Auto Scaling Group with a minimum capacity of 1.',D:'Set up CloudWatch alarms to notify the team if the EC2 instance fails.'},correct:['B'],exp:{A:'Restoring from EBS snapshots requires launching a new instance and mounting the volume — typically 10-30+ minutes. Cannot meet 2-minute RTO.',B:'RDS Multi-AZ maintains a synchronous standby in another AZ. Failover is automatic and typically completes in 60-120 seconds.',C:'An ASG with min capacity 1 will replace a failed instance, but instance replacement (launch, boot, app startup) takes 3-10+ minutes — may not meet 2-minute RTO.',D:'CloudWatch alarms + notification requires human action — cannot achieve 2-minute automated RTO.'},rule:'Sub-2-minute automated DB failover = RDS Multi-AZ (60-120 second automatic failover).'},
{n:36,d:2,t:'mc',stem:'New order events must trigger inventory updates, confirmation emails, and analytics logging. The failure of one system must not affect the others. What is the recommended pattern?',opts:{A:'Write to a single SQS queue; each system polls and filters relevant messages.',B:'Publish to an SNS topic; each system subscribes through its own SQS queue.',C:'Store in DynamoDB; each system polls for new records.',D:'Call each downstream system synchronously from a Lambda function.'},correct:['B'],exp:{A:'A single SQS queue delivers each message to only one consumer — systems compete for the same messages.',B:'SNS fan-out: one publish, all subscribers receive a copy. Each system\'s SQS queue buffers independently. If one system fails, its queue retains the message without affecting others.',C:'DynamoDB polling is an anti-pattern for event-driven architecture.',D:'Synchronous calls create tight coupling — if any system is slow or fails, the Lambda is blocked.'},rule:'One event to multiple independent systems = SNS topic + SQS queue per subscriber. Failure of one subscriber does not affect others.'},
{n:37,d:2,t:'mc',stem:'A Step Functions workflow has a payment step that occasionally fails due to transient network errors. It should be retried up to 3 times with exponential backoff before marking the order as failed. How should this be implemented?',opts:{A:'Add a Lambda error handler that calls the payment Lambda again on failure.',B:'Configure a Retry block in the Step Functions state definition with MaxAttempts: 3 and exponential backoff.',C:'Wrap the payment Lambda in a try/catch and re-invoke itself recursively up to 3 times.',D:'Use an SQS Dead Letter Queue to retry failed payment messages.'},correct:['B'],exp:{A:'A separate Lambda error handler adds orchestration complexity and is not the built-in Step Functions mechanism.',B:'Step Functions states natively support Retry configurations with MaxAttempts, IntervalSeconds, BackoffRate, and error type matching. This is the purpose-built declarative mechanism — no code changes needed.',C:'Recursive Lambda invocations can exceed the 15-minute timeout and are an anti-pattern.',D:'DLQ retries are for SQS message processing — not for Step Functions step retries.'},rule:'Retry logic in Step Functions = Retry block in state definition. Handles retries, backoff, and error catching natively.'},

// ── DOMAIN 3: HIGH-PERFORMING (17 Qs) ───────────────────────────────────────
{n:38,d:3,t:'mc',stem:'A high-traffic read-heavy application queries the same popular product data hundreds of times per second from a relational database. Database CPU is consistently above 80%. What is the MOST effective way to reduce database load?',opts:{A:'Upgrade the database to a larger instance type.',B:'Add a read replica and distribute read queries to it.',C:'Add an Amazon ElastiCache Redis cluster in front of the database and cache frequently accessed data.',D:'Enable RDS Multi-AZ.'},correct:['C'],exp:{A:'A larger instance increases capacity but the DB still executes every query.',B:'A read replica offloads reads from the primary but still executes every query. Sub-millisecond cache response is far faster.',C:'ElastiCache Redis caches query results. Repeated queries for the same data are served from cache at sub-millisecond latency — the database is only queried on a cache miss.',D:'Multi-AZ provides failover HA — the standby is not readable and does not reduce read load.'},rule:'"Read-heavy, same data queried repeatedly" = ElastiCache in front of DB. Cache hit = DB never touched.'},
{n:39,d:3,t:'mc',stem:'A data science team runs nightly Apache Spark jobs that process 10TB of raw log data stored in S3. Jobs run for 4 hours and are not time-sensitive. Which compute service is most appropriate?',opts:{A:'AWS Lambda',B:'Amazon EC2 On-Demand with Auto Scaling',C:'Amazon EMR with Spot Instances for task nodes',D:'AWS Fargate'},correct:['C'],exp:{A:'Lambda has a 15-minute maximum execution time — not suitable for 4-hour Spark jobs.',B:'EC2 On-Demand can run Spark but without managed Spark integration requires significant operational overhead. Also expensive.',C:'EMR is the managed service for Apache Spark/Hadoop. Spot Instances for task nodes reduce cost by up to 90%. If a Spot instance is reclaimed, EMR automatically retries the task. Ideal for fault-tolerant, cost-sensitive batch jobs.',D:'Fargate runs containers — it does not natively manage Spark cluster orchestration.'},rule:'"Spark/Hadoop on AWS, large data, fault-tolerant" = Amazon EMR. Spot task nodes = cost optimization.'},
{n:40,d:3,t:'mc',stem:'A company is migrating from an on-premises Oracle database to AWS. The application can be refactored. The team wants to minimize licensing costs and improve performance. Which target database is most appropriate?',opts:{A:'Amazon RDS for Oracle with BYOL',B:'Amazon Aurora PostgreSQL',C:'Amazon DynamoDB',D:'Amazon Redshift'},correct:['B'],exp:{A:'RDS for Oracle with BYOL still requires an Oracle license.',B:'Aurora PostgreSQL is MySQL and PostgreSQL compatible, significantly outperforms standard PostgreSQL, and eliminates Oracle licensing entirely. It is the most common migration target from Oracle when the application can be refactored.',C:'DynamoDB is a NoSQL key-value/document store — not a drop-in replacement for a relational Oracle database.',D:'Redshift is a columnar data warehouse for OLAP — not suitable as an OLTP operational database replacement.'},rule:'"Oracle to AWS, minimize licensing" = Aurora PostgreSQL. Use AWS SCT + DMS for heterogeneous migration.'},
{n:41,d:3,t:'mc',stem:'A mobile application needs to store user session data accessible with microsecond latency that must persist even if an ElastiCache node is restarted. Which ElastiCache configuration should the architect choose?',opts:{A:'ElastiCache for Memcached',B:'ElastiCache for Redis with AOF persistence enabled',C:'ElastiCache for Redis without persistence',D:'ElastiCache for Memcached with Multi-AZ'},correct:['B'],exp:{A:'Memcached does not support persistence — all data is lost on node restart.',B:'Redis supports AOF (Append Only File) persistence, which logs every write operation so data can be recovered after restart. Redis also supports complex data structures needed for session management.',C:'Redis without persistence provides microsecond latency but all data is lost on restart — does not meet the persistence requirement.',D:'Memcached does not natively support Multi-AZ replication or persistence.'},rule:'"ElastiCache + persist after restart" = Redis with persistence. Memcached = no persistence, simple key-value only.'},
{n:42,d:3,t:'mc',stem:'An application requires millions of requests per second with single-digit millisecond latency at any scale, a fully serverless option, and no schema management. Which AWS database service is the best fit?',opts:{A:'Amazon Aurora Serverless',B:'Amazon RDS PostgreSQL',C:'Amazon DynamoDB',D:'Amazon Redshift Serverless'},correct:['C'],exp:{A:'Aurora Serverless is relational (requires schema) and designed for variable-load workloads, not consistently millions of requests per second.',B:'RDS PostgreSQL is relational, requires schema, and does not scale to millions of requests/second without significant sharding.',C:'DynamoDB is a fully managed NoSQL service that delivers single-digit millisecond performance at any scale, is serverless, and requires no schema.',D:'Redshift Serverless is a data warehouse for OLAP analytics — not for high-frequency OLTP at millions of requests/second.'},rule:'"Millions req/sec + single-digit ms + serverless + no schema" = DynamoDB.'},
{n:43,d:3,t:'mc',stem:'A company stores 500TB of historical data in S3 in JSON format. Analysts run ad-hoc SQL queries. The team wants to minimize query costs without ETL infrastructure. What is the best solution?',opts:{A:'Load the data into Amazon Redshift.',B:'Use Amazon Athena to query S3 directly, and convert data from JSON to Parquet format using AWS Glue.',C:'Copy the data to an RDS instance.',D:'Use Amazon EMR to run Hive queries.'},correct:['B'],exp:{A:'Loading 500TB into Redshift requires provisioning and managing a cluster with ongoing hourly costs.',B:'Athena is serverless and queries S3 directly with no infrastructure. Parquet is columnar — Athena scans only needed columns, reducing data scanned 3-5x vs JSON, directly reducing cost. Glue converts JSON to Parquet.',C:'Copying 500TB to RDS requires storage provisioning and ongoing compute cost.',D:'EMR can run Hive against S3 but requires provisioning and managing a cluster.'},rule:'"SQL on S3, no infrastructure, minimize cost" = Athena. JSON → Parquet with Glue reduces Athena cost 3-5x.'},
{n:44,d:3,t:'mc',stem:'An application needs to deliver 100,000 events per second to Amazon S3 for later batch analysis. Processing latency up to 5 minutes is acceptable. No servers should need to be managed. Which service is most appropriate?',opts:{A:'Amazon Kinesis Data Streams with custom Lambda consumer writing to S3',B:'Amazon Kinesis Data Firehose delivering to S3',C:'Amazon SQS with an Auto Scaling EC2 fleet writing to S3',D:'AWS DataSync'},correct:['B'],exp:{A:'Kinesis Data Streams + Lambda can write to S3 but requires managing the Lambda consumer, shard count, and error handling.',B:'Kinesis Data Firehose is fully serverless — it receives streaming data, buffers it (60s to 15 min), and delivers directly to S3. Automatically scales to 100,000+ events/second.',C:'SQS + EC2 requires managing an Auto Scaling fleet — significant operational overhead.',D:'DataSync is for transferring existing files from storage systems to AWS, not for ingesting streaming events.'},rule:'"Streaming events → S3, near-real-time (minutes acceptable), no servers" = Kinesis Data Firehose.'},
{n:45,d:3,t:'mc',stem:'A global application is deployed only in us-east-1. For non-cacheable dynamic content (API calls), users in Asia experience high latency. Which service reduces latency without re-architecting the application?',opts:{A:'Amazon CloudFront with API Gateway origin',B:'AWS Global Accelerator',C:'Amazon Route 53 latency-based routing',D:'An additional EC2 deployment in ap-southeast-1'},correct:['B'],exp:{A:'CloudFront is optimized for cacheable content. Dynamic non-cacheable API responses still need to travel to origin with similar latency.',B:'Global Accelerator routes user traffic to the nearest AWS edge location, then through AWS\'s private global network backbone to the application — eliminating public internet hops for the long-haul journey. No application changes required.',C:'Latency-based routing requires deploying the application in multiple regions — re-architecting.',D:'Deploying in a second region is re-architecting the application.'},rule:'"Dynamic content, global users, reduce latency, no re-architecture" = Global Accelerator. CloudFront = cacheable static content.'},
{n:46,d:3,t:'mc',stem:'A DynamoDB table has high read traffic for popular items. Users experience latency above 5ms. The team wants sub-millisecond read latency without application code changes. Which solution meets this?',opts:{A:'Enable DynamoDB auto scaling.',B:'Add an Amazon DynamoDB Accelerator (DAX) cluster in front of the table.',C:'Switch to DynamoDB On-Demand capacity mode.',D:'Add a Global Secondary Index to the table.'},correct:['B'],exp:{A:'Auto scaling adjusts capacity to handle load — it does not reduce query latency.',B:'DAX is an in-memory cache purpose-built for DynamoDB. It is API-compatible, so most applications need only a configuration change (not code rewrites) to point to the DAX endpoint. Delivers microsecond read latency.',C:'On-Demand mode changes billing — it does not reduce query latency.',D:'GSIs enable alternative access patterns — they do not reduce latency for already-supported query patterns.'},rule:'"DynamoDB + sub-millisecond/microsecond reads" = DAX. API-compatible, microsecond cache hits.'},
{n:47,d:3,t:'mc',stem:'Multiple EC2 Linux instances across three Availability Zones need to simultaneously read from and write to a shared file system that automatically scales in capacity. Which storage service meets this requirement?',opts:{A:'Amazon EBS with Multi-Attach',B:'Amazon S3',C:'Amazon EFS',D:'Amazon FSx for Windows File Server'},correct:['C'],exp:{A:'EBS Multi-Attach allows one volume to attach to multiple EC2 instances but only within a single AZ and only with io1/io2 volumes.',B:'S3 is object storage — it cannot be mounted as a POSIX filesystem by EC2 instances directly.',C:'EFS is a fully managed NFS file system mountable by thousands of EC2 instances simultaneously across multiple AZs. Capacity scales automatically.',D:'FSx for Windows File Server uses SMB — not suitable for Linux instances requiring POSIX NFS.'},rule:'"Shared filesystem, Linux EC2, multiple AZs, auto-scale" = Amazon EFS.'},
{n:48,d:3,t:'mc',stem:'A new application expects unpredictable traffic — some days very low, some very high. The relational database must scale automatically and the team does not want to manage capacity planning. Which is most appropriate?',opts:{A:'Amazon RDS MySQL with Provisioned IOPS',B:'Amazon Aurora Serverless v2',C:'Amazon DynamoDB Provisioned capacity',D:'Amazon RDS PostgreSQL Multi-AZ'},correct:['B'],exp:{A:'RDS Provisioned requires selecting instance size and IOPS upfront — requires capacity planning and manual scaling.',B:'Aurora Serverless v2 scales capacity automatically in fine-grained increments based on actual load. Billing is per ACU-second, so low-traffic periods cost significantly less.',C:'DynamoDB Provisioned requires setting RCU/WCU upfront. Also DynamoDB is not relational.',D:'RDS PostgreSQL Multi-AZ provides HA failover but requires fixed instance size — no auto-scaling of compute.'},rule:'"Relational DB, unpredictable load, no capacity planning" = Aurora Serverless v2.'},
{n:49,d:3,t:'mr',stem:'IoT sensors produce 50,000 records/second. Data must be available for real-time analytics within 100 milliseconds. Multiple analytics applications need to independently consume the same stream. Which TWO services should the architect use? (Choose TWO)',opts:{A:'Amazon SQS FIFO queue',B:'Amazon Kinesis Data Streams',C:'AWS Lambda consuming from SQS',D:'Amazon Kinesis Data Analytics (Apache Flink)',E:'Amazon S3 with event notifications'},correct:['B','D'],exp:{A:'SQS FIFO supports 300 TPS (3,000 with batching) — far below 50,000 records/second. Also each message is consumed once; multiple analytics apps would compete.',B:'Kinesis Data Streams handles 50,000+ records/second, retains data up to 365 days, and allows multiple independent consumer applications to read the same stream.',C:'Lambda + SQS cannot handle the throughput requirement and does not support multiple independent consumers of the same messages.',D:'Kinesis Data Analytics (Flink) connects to Kinesis Data Streams and enables real-time SQL/Flink processing with sub-second latency — meeting the 100ms requirement.',E:'S3 event notifications trigger on object creation — not for streaming 50,000 records/second with sub-100ms latency.'},rule:'IoT streaming 50k/sec + real-time analytics + multiple consumers = Kinesis Data Streams + Kinesis Data Analytics (Flink).'},
{n:50,d:3,t:'mc',stem:'An application in a VPC makes millions of API calls per day to Amazon S3. The network team reports high data transfer costs via the NAT Gateway. How can the architect eliminate these costs?',opts:{A:'Enable S3 Transfer Acceleration.',B:'Create an S3 VPC Gateway Endpoint and update the route table to route S3 traffic through it.',C:'Create an S3 VPC Interface Endpoint (PrivateLink).',D:'Use AWS Direct Connect to access S3.'},correct:['B'],exp:{A:'Transfer Acceleration speeds up uploads using CloudFront edge locations — it does not reduce NAT Gateway costs for API calls.',B:'An S3 Gateway Endpoint is free and routes S3 traffic through the AWS internal network via the VPC route table — bypassing the NAT Gateway entirely. No NAT Gateway processing fees.',C:'An Interface Endpoint (PrivateLink) for S3 also provides private access but costs per-hour and per-GB. The Gateway Endpoint is free and is the correct answer for S3 and DynamoDB.',D:'Direct Connect is for on-premises to AWS connectivity — not for VPC-to-S3 routing within AWS.'},rule:'"High NAT Gateway costs accessing S3 or DynamoDB from private subnets" = S3/DynamoDB Gateway VPC Endpoint (FREE).'},
{n:51,d:3,t:'mc',stem:'An application needs to inspect all inbound network traffic for intrusions using a third-party virtual firewall appliance before traffic reaches the ALB. Which load balancer type enables this architecture?',opts:{A:'Application Load Balancer (ALB)',B:'Network Load Balancer (NLB)',C:'Gateway Load Balancer (GWLB)',D:'Classic Load Balancer'},correct:['C'],exp:{A:'ALB routes HTTP/HTTPS at Layer 7 — it cannot transparently forward all IP traffic to a third-party inspection appliance and back.',B:'NLB routes TCP/UDP at Layer 4 — it does not support the bump-in-the-wire pattern for security appliances.',C:'GWLB is designed specifically for inline traffic inspection by third-party network virtual appliances. Traffic is routed through the GWLB to appliances and back before reaching the destination.',D:'Classic Load Balancer is legacy and does not support the appliance inspection pattern.'},rule:'"Third-party firewall, IDS/IPS, inline traffic inspection" = Gateway Load Balancer (GWLB).'},
{n:52,d:3,t:'mc',stem:'A company is migrating a large MySQL database to AWS. The source database must continue to serve production traffic until cutover. Which service enables near-zero downtime migration?',opts:{A:'AWS DataSync',B:'AWS Database Migration Service (DMS) with ongoing replication (CDC)',C:'AWS Snowball Edge',D:'mysqldump followed by restore to RDS'},correct:['B'],exp:{A:'DataSync moves files/objects between storage systems — it is not for database migration.',B:'DMS can perform initial data load while the source is live, then switch to ongoing Change Data Capture (CDC) replication to keep the target in sync. When ready for cutover, redirect the application — minimal downtime.',C:'Snowball Edge is for large offline data transfer — it cannot do real-time CDC replication.',D:'mysqldump exports a point-in-time snapshot. For a large database the dump and restore take hours — significant downtime.'},rule:'"Minimal downtime database migration" = AWS DMS with CDC. Loads initial data, then keeps target in sync until cutover.'},
{n:53,d:3,t:'mc',stem:'A company needs a network connection to AWS providing consistent, low-latency throughput of 5 Gbps for transferring large datasets daily from their on-premises data centre. VPN has proven unreliable. Which solution meets this?',opts:{A:'AWS Site-to-Site VPN with multiple tunnels',B:'AWS Direct Connect with a 10 Gbps port',C:'AWS Global Accelerator',D:'Amazon CloudFront with on-premises origin'},correct:['B'],exp:{A:'Site-to-Site VPN is limited to approximately 1.25 Gbps per tunnel and traverses the public internet — inherently variable latency and throughput.',B:'Direct Connect provides a dedicated physical connection with consistent throughput and low, predictable latency. A 10 Gbps port comfortably supports 5 Gbps sustained throughput.',C:'Global Accelerator optimizes routing for internet traffic — it does not provide a dedicated physical connection.',D:'CloudFront is a content delivery network — not suitable for dedicated high-bandwidth on-premises to AWS connectivity.'},rule:'"Consistent, dedicated, low-latency, high-bandwidth on-prem to AWS" = Direct Connect.'},
{n:54,d:3,t:'mc',stem:'A company has 20 VPCs in the same region that all need to communicate with each other and with an on-premises network via Direct Connect. VPC peering has become unmanageable. What is the recommended solution?',opts:{A:'Create VPC peering connections between every pair of VPCs (full mesh).',B:'Use AWS Transit Gateway to connect all VPCs and the Direct Connect connection.',C:'Deploy a VPN between each VPC pair.',D:'Use PrivateLink to connect all VPCs.'},correct:['B'],exp:{A:'Full mesh VPC peering for 20 VPCs requires (20x19)/2 = 190 peering connections. VPC peering is also non-transitive.',B:'Transit Gateway acts as a regional hub. Each VPC attaches once and can route to all other attached VPCs and Direct Connect connections. Supports transitive routing. Scales to thousands of VPCs.',C:'VPN between each pair has the same scaling problem as peering plus IPsec overhead.',D:'PrivateLink exposes specific services from one VPC to another — not a general routing mesh.'},rule:'"Many VPCs + transitive routing + DX hub-and-spoke" = Transit Gateway. VPC Peering = non-transitive, point-to-point, does not scale.'},

// ── DOMAIN 4: COST-OPTIMIZED (11 Qs) ────────────────────────────────────────
{n:55,d:4,t:'mc',stem:'A development environment on EC2 is used only Monday to Friday, 9am to 6pm. The instances must retain their data between sessions. Which combination reduces costs the most?',opts:{A:'Use Spot Instances with persistent storage.',B:'Use On-Demand instances and stop them outside business hours using an EventBridge scheduled rule and Lambda.',C:'Purchase 1-year Reserved Instances.',D:'Use Spot Instances and terminate them each night, restoring from AMI each morning.'},correct:['B'],exp:{A:'Spot Instances can be interrupted at any time — unsuitable for a dev environment that needs reliable availability during business hours.',B:'Stopping EC2 instances (not terminating) preserves EBS volumes and data. Stopped instances incur no compute charges. Automating stop/start with EventBridge + Lambda eliminates ~65 hours per week of idle compute cost.',C:'Reserved Instances commit to paying for 24/7 usage — wasteful for an environment used only ~45 hours/week.',D:'Spot termination risk makes this unreliable. Also restoring from AMI each morning loses session state.'},rule:'"Dev environment, nights/weekends idle, retain data" = On-Demand + Stop (not terminate) on schedule.'},
{n:56,d:4,t:'mc',stem:'A company has a steady-state production workload on 20 On-Demand EC2 instances running unchanged for 8 months. The EC2 bill is the largest expense. What is the single most impactful way to reduce this cost?',opts:{A:'Purchase 1-year Reserved Instances or Compute Savings Plans.',B:'Move the entire workload to AWS Lambda.',C:'Enable EC2 Auto Scaling to scale in to 0 instances overnight.',D:'Enable T-series unlimited mode on all instances.'},correct:['A'],exp:{A:'Steady-state 24/7 workloads are exactly the right candidate for Reserved Instances (up to 60% savings) or Compute Savings Plans (up to 66% savings). Highest-impact single action — no code changes.',B:'Migrating to Lambda is a significant re-architecture effort.',C:'If the workload is steady-state production, scaling to 0 would break the application.',D:'T-series unlimited mode avoids CPU throttling but adds cost if baseline is consistently exceeded.'},rule:'"Steady-state 24/7 workload, largest EC2 bill" = Reserved Instances or Savings Plans. Up to 60-66% savings.'},
{n:57,d:4,t:'mc',stem:'A company needs to store infrequently accessed compliance records in S3. Records must be retained for 7 years and retrieval within 12 hours is acceptable. What is the most cost-effective storage class?',opts:{A:'S3 Standard',B:'S3 Standard-Infrequent Access',C:'S3 Glacier Flexible Retrieval',D:'S3 Glacier Instant Retrieval'},correct:['C'],exp:{A:'S3 Standard is the most expensive tier — optimized for frequent access. Wasteful for 7-year compliance archives.',B:'Standard-IA is cheaper than Standard but more expensive per GB than Glacier. Designed for data accessed once or twice a month.',C:'Glacier Flexible Retrieval offers the lowest storage cost for data accessed infrequently over years. Retrieval takes minutes to hours — well within the 12-hour requirement.',D:'Glacier Instant Retrieval costs more than Flexible Retrieval — the millisecond retrieval speed is unnecessary when 12 hours is acceptable.'},rule:'"Rarely accessed archive, hours retrieval OK" = Glacier Flexible Retrieval (cheapest for true archive).'},
{n:58,d:4,t:'mc',stem:'A media company stores 200TB of video files. Files are accessed heavily for the first 30 days after upload, then rarely afterward. The company wants to minimize storage costs automatically. What should the architect configure?',opts:{A:'Manually move files to Glacier after 30 days using a Lambda script.',B:'Enable S3 Intelligent-Tiering.',C:'Configure an S3 Lifecycle Policy to transition objects to Standard-IA after 30 days and to Glacier after 90 days.',D:'Use S3 Requester Pays to shift costs to downstream consumers.'},correct:['C'],exp:{A:'Manual Lambda scripts are operationally fragile and require maintenance.',B:'Intelligent-Tiering automatically moves objects between tiers based on access patterns but charges a monitoring fee per object. For known access patterns, a Lifecycle Policy is more cost-effective.',C:'S3 Lifecycle Policy automates transitions based on age. Objects move to Standard-IA (cheaper, still accessible) at 30 days, then to Glacier (cheapest) at 90 days. No monitoring fee.',D:'Requester Pays shifts transfer costs — it does not reduce storage costs.'},rule:'"Known access pattern (active then cold)" = S3 Lifecycle Policy. Intelligent-Tiering = unknown/variable patterns.'},
{n:59,d:4,t:'mc',stem:'A non-production analytics workload processes data for 6 hours per day. The jobs are fault-tolerant and can restart from a checkpoint if interrupted. Which EC2 purchasing option minimizes cost?',opts:{A:'On-Demand instances',B:'Reserved Instances (1-year term)',C:'Spot Instances',D:'Dedicated Hosts'},correct:['C'],exp:{A:'On-Demand is the baseline — no discount. Correct when interruption cannot be tolerated.',B:'Reserved Instances save ~40% but commit to 24/7 payment. The workload runs only 6 hours/day — paying for idle hours is wasteful.',C:'Spot Instances offer up to 90% off On-Demand pricing. The workload is fault-tolerant (can checkpoint and restart) — interruptions are handled gracefully.',D:'Dedicated Hosts are the most expensive option — for license compliance, not cost optimization.'},rule:'"Fault-tolerant, can restart, non-production" = Spot Instances. Up to 90% off.'},
{n:60,d:4,t:'mc',stem:'A three-tier web application is deployed across three Availability Zones. How should the architect configure NAT Gateways for production at minimum cost?',opts:{A:'One NAT Gateway in a single AZ shared by all three private subnets.',B:'One NAT Gateway per AZ — three total — with each AZ\'s private subnet routing through its own NAT Gateway.',C:'No NAT Gateway — all instances get public IPs.',D:'Use NAT instances (EC2) instead of managed NAT Gateways.'},correct:['B'],exp:{A:'A single NAT Gateway is cheaper per hour but traffic from other AZs incurs cross-AZ data transfer charges ($0.01/GB each direction) and is a single AZ failure point.',B:'One NAT Gateway per AZ routes traffic within the same AZ — avoiding cross-AZ data transfer charges. Also provides AZ-level fault isolation. For production with meaningful cross-AZ data transfer, this is both more reliable and often cheaper when accounting for cross-AZ fees.',C:'Public IPs expose instances directly to the internet — a security anti-pattern.',D:'NAT instances require managing EC2, patching, and scaling — high operational overhead.'},rule:'Production NAT = one NAT Gateway per AZ. Single NAT = cheaper hourly but cross-AZ charges + single AZ failure risk.'},
{n:61,d:4,t:'mc',stem:'A company wants to understand which individual AWS services, resource IDs, and tags are driving their monthly bill with line-item detail, and visualize this in a custom Amazon QuickSight dashboard. Which AWS service provides the required billing data?',opts:{A:'AWS Cost Explorer',B:'AWS Budgets',C:'AWS Cost and Usage Report (CUR) delivered to S3 and queried with Athena',D:'AWS Trusted Advisor'},correct:['C'],exp:{A:'Cost Explorer provides summarized cost analysis — useful for quick analysis but not line-item granular and not designed for custom BI pipelines.',B:'Budgets alerts on spend thresholds — it is not a data export mechanism for custom dashboards.',C:'CUR is the most granular billing dataset — line-item per resource per hour with all tags. Delivered to S3, queried with Athena, visualized in QuickSight. The correct pipeline for custom billing dashboards.',D:'Trusted Advisor provides cost optimization recommendations — not raw line-item billing data.'},rule:'"Most granular billing, custom dashboard, Athena, QuickSight" = Cost and Usage Report (CUR) → S3 → Athena → QuickSight.'},
{n:62,d:4,t:'mc',stem:'An Aurora MySQL cluster in us-east-1 with 2 Aurora Replicas is consistently over-provisioned — CPU is always below 20%. AWS Compute Optimizer recommends a smaller instance class. What is the most cost-effective next step?',opts:{A:'Delete one Aurora Replica.',B:'Migrate from Aurora to RDS MySQL.',C:'Resize the Aurora instances to the recommended smaller class during a maintenance window.',D:'Switch to DynamoDB.'},correct:['C'],exp:{A:'Deleting a replica reduces read scaling capacity and HA. If 2 replicas are needed, this degrades the architecture.',B:'Aurora generally provides better price-performance than standard RDS for equivalent workloads — migrating adds complexity and may not save money.',C:'If the cluster is consistently over-provisioned, right-sizing to a smaller instance class directly reduces the per-hour cost. Aurora supports instance resizing with a brief failover.',D:'Migrating from relational Aurora to DynamoDB is a complete application rewrite.'},rule:'"Over-provisioned database, Compute Optimizer recommendation" = right-size to smaller instance class.'},
{n:63,d:4,t:'mc',stem:'An ECS application has some services running 24/7 for production and others running only during business hours for internal tools. Which compute purchasing strategy minimizes cost for each?',opts:{A:'Use Spot capacity for all services.',B:'Use Fargate On-Demand for all services.',C:'Use Fargate Savings Plans for 24/7 production services; Fargate On-Demand with scheduled stop/start for business-hours services.',D:'Migrate 24/7 services to EC2 Reserved Instances; keep business-hours services on Fargate.'},correct:['C'],exp:{A:'Spot capacity for production 24/7 services risks interruption. Not suitable for critical production.',B:'On-Demand for 24/7 services misses savings available via Compute Savings Plans.',C:'Fargate (Compute) Savings Plans commit to $/hour usage and save up to 52% for steady-state workloads. Business-hours services use On-Demand with stop/start automation — no wasteful idle payment.',D:'Migrating to EC2 adds operational overhead (patching, scaling config) and is a more complex change.'},rule:'24/7 containers = Compute Savings Plans. Part-time workloads = On-Demand with stop/start automation.'},
{n:64,d:4,t:'mc',stem:'A company uses Direct Connect for on-premises to AWS connectivity. Large amounts of data are transferred from AWS to on-premises daily and data transfer costs are high. Which approach reduces data transfer costs while maintaining the Direct Connect connection?',opts:{A:'Add a Site-to-Site VPN as an additional path to distribute traffic.',B:'Enable data compression at the application layer before transferring over Direct Connect.',C:'Move data to Amazon S3 and use S3 batch operations rather than real-time transfer.',D:'Use AWS DataSync with schedule-based transfers during off-peak hours.'},correct:['B'],exp:{A:'Adding VPN routes traffic over the internet (which also has egress costs) — does not reduce the volume of data transferred.',B:'Direct Connect charges per GB transferred. Compressing data at the application layer before transfer reduces actual bytes over the DX link, directly reducing the per-GB charge.',C:'Moving to S3 batch operations changes the access pattern but still requires transferring data to on-premises — egress cost remains.',D:'DataSync schedules do not reduce per-GB charges, only potentially shift when they occur.'},rule:'Reduce Direct Connect data transfer costs = reduce bytes transferred (compression). DX charges per GB regardless.'},
{n:65,d:4,t:'mr',stem:'A startup is building a new serverless application. They expect highly variable traffic — some hours zero requests, some hours thousands. They want to minimize cost and operational overhead. Which TWO services form the most cost-effective serverless stack? (Choose TWO)',opts:{A:'Amazon EC2 Auto Scaling Group (On-Demand)',B:'AWS Lambda',C:'Amazon RDS PostgreSQL (Multi-AZ)',D:'Amazon DynamoDB with On-Demand capacity',E:'Amazon Kinesis Data Streams'},correct:['B','D'],exp:{A:'EC2 ASG incurs cost even at minimum capacity. Operational overhead of managing instances. Not serverless.',B:'Lambda charges per invocation and millisecond of execution — zero requests = zero cost. Scales automatically from zero to thousands.',C:'RDS Multi-AZ charges per hour for the running instance regardless of query volume. Significant cost at low traffic.',D:'DynamoDB On-Demand charges per request — zero requests = zero cost. No capacity planning. Serverless, fully managed.',E:'Kinesis Data Streams charges per shard-hour (minimum 1 shard) — cost incurred even at zero traffic.'},rule:'"Serverless, pay-for-use, variable to zero traffic" = Lambda + DynamoDB On-Demand. Both cost zero when idle.'},
];

// ─── State ───────────────────────────────────────────────────────────────────
let currentFilter='all';
let order=Q.map((_,i)=>i);
const revealed=new Set();
let revealedCount=0,correctCount=0;

function updateScore(){
  document.getElementById('scorePill').textContent=`${correctCount} correct · ${revealedCount} answered`;
  const vis=order.filter(i=>currentFilter==='all'||Q[i].d.toString()===currentFilter);
  const denom=vis.length||65;
  document.getElementById('progFill').style.width=(revealedCount/denom*100)+'%';
  document.getElementById('progLabel').textContent=`${revealedCount} of ${vis.length} revealed`;
}

// ─── Build ────────────────────────────────────────────────────────────────────
function buildQuestions(){
  const list=document.getElementById('qlist');
  list.querySelectorAll('.qcard').forEach(c=>c.remove());
  const dColors={1:'d1',2:'d2',3:'d3',4:'d4'};
  const dNames={1:'Secure',2:'Resilient',3:'High-Performing',4:'Cost-Optimized'};

  order.forEach((qi,pos)=>{
    const q=Q[qi];
    const dc=dColors[q.d];
    const isMR=q.t==='mr';
    const card=document.createElement('div');
    card.className='qcard';
    card.id=`card-${qi}`;
    card.dataset.domain=q.d;

    // Header
    const hdr=document.createElement('div');
    hdr.className='qcard-header';
    hdr.onclick=()=>card.classList.toggle('open');
    hdr.innerHTML=`<div class="qnum">Q${pos+1}</div><div style="flex:1"><div class="qmeta"><span class="badge badge-${dc}">Domain ${q.d} &middot; ${dNames[q.d]}</span><span class="badge badge-${isMR?'mr':'mc'}">${isMR?'Multiple Response':'Multiple Choice'}</span></div><div class="qtext">${q.stem}</div></div><div class="chevron">&#8964;</div>`;

    // Body
    const body=document.createElement('div');
    body.className='qcard-body';

    // Options
    const optsDiv=document.createElement('div');
    optsDiv.className='options';
    optsDiv.id=`opts-${qi}`;
    Object.entries(q.opts).forEach(([letter,text])=>{
      const opt=document.createElement('div');
      opt.className='opt';
      opt.id=`opt-${qi}-${letter}`;
      opt.innerHTML=`<div class="opt-label">${letter}</div><div class="opt-text">${text}</div>`;
      opt.onclick=()=>{
        if(revealed.has(qi))return;
        if(!isMR){optsDiv.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));}
        opt.classList.toggle('selected');
      };
      optsDiv.appendChild(opt);
    });

    // Reveal btn
    const rWrap=document.createElement('div');
    rWrap.className='reveal-wrap';
    const rBtn=document.createElement('button');
    rBtn.className='reveal-btn';
    rBtn.id=`rbtn-${qi}`;
    rBtn.textContent=isMR?'Show Answer (Choose TWO or more)':'Show Answer';
    rBtn.onclick=()=>doReveal(qi,q,card,optsDiv,rBtn);
    rWrap.appendChild(rBtn);

    // Explanation
    const expDiv=document.createElement('div');
    expDiv.className='explanation';
    let expHtml='<div class="exp-header">— EXPLANATION —</div><div class="exp-opts">';
    Object.entries(q.exp).forEach(([letter,text])=>{
      const isC=q.correct.includes(letter);
      expHtml+=`<div class="exp-opt ${isC?'correct':'wrong'}"><div class="exp-lbl">${letter}</div><div class="exp-text"><strong>${isC?'✓ Correct':'✗ Wrong'}</strong> — ${text}</div></div>`;
    });
    expHtml+='</div>';
    if(q.rule)expHtml+=`<div class="key-rule">&#x26A1; ${q.rule}</div>`;
    expDiv.innerHTML=expHtml;

    body.appendChild(optsDiv);
    body.appendChild(rWrap);
    body.appendChild(expDiv);
    card.appendChild(hdr);
    card.appendChild(body);
    list.appendChild(card);
  });

  applyFilter(currentFilter);
}

function doReveal(qi,q,card,optsDiv,rBtn){
  if(revealed.has(qi))return;
  revealed.add(qi);
  revealedCount++;

  // Check correctness before clearing selection
  const selected=[...optsDiv.querySelectorAll('.opt.selected')].map(o=>o.querySelector('.opt-label').textContent);
  const correctSet=new Set(q.correct);
  const isCorrect=selected.length===correctSet.size&&selected.every(l=>correctSet.has(l));
  if(isCorrect){correctCount++;card.classList.add('answered-correct');}
  else{card.classList.add('answered-wrong');}

  // Color options
  optsDiv.querySelectorAll('.opt').forEach(o=>{
    const letter=o.querySelector('.opt-label').textContent;
    o.classList.remove('selected');
    o.classList.add(q.correct.includes(letter)?'rev-correct':'rev-wrong');
    o.onclick=null;o.style.cursor='default';
  });

  card.classList.add('revealed','open');
  rBtn.classList.add('done');
  rBtn.textContent='Revealed';
  updateScore();
}

function filter(domain,btn){
  currentFilter=domain;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter(domain);
}

function applyFilter(domain){
  revealedCount=0;correctCount=0;
  let visible=0;
  document.querySelectorAll('.qcard').forEach(card=>{
    const d=card.dataset.domain;
    const qi=parseInt(card.id.split('-')[1]);
    if(domain==='all'||d===domain){
      card.classList.remove('hidden');visible++;
      if(revealed.has(qi)){revealedCount++;if(card.classList.contains('answered-correct'))correctCount++;}
    }else{card.classList.add('hidden');}
  });
  document.getElementById('emptyMsg').style.display=visible===0?'block':'none';
  updateScore();
}

function resetAll(){
  if(!confirm('Reset all answers and progress?'))return;
  revealed.clear();revealedCount=0;correctCount=0;
  buildQuestions();updateScore();
}

function revealAll(){
  order.forEach(qi=>{
    const card=document.getElementById(`card-${qi}`);
    if(!card.classList.contains('hidden')&&!revealed.has(qi)){
      const q=Q[qi];
      const optsDiv=document.getElementById(`opts-${qi}`);
      const rBtn=document.getElementById(`rbtn-${qi}`);
      card.classList.add('open');
      doReveal(qi,q,card,optsDiv,rBtn);
    }
  });
}

function shuffleQuestions(){
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  revealed.clear();revealedCount=0;correctCount=0;
  buildQuestions();updateScore();
}

window.addEventListener('scroll',()=>{
  document.getElementById('scrolltop').classList.toggle('visible',window.scrollY>400);
});

buildQuestions();
updateScore();
</script>
