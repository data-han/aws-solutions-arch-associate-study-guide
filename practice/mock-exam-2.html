  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .option.wrong .option-letter { color: #ef4444; }
    .option.missed .option-letter { color: #f59e0b; }

    .option.wrong .option-explanation { color: #fca5a5; }

    .option.wrong .option-icon::after { content: "✗"; color: #ef4444; display: block; }
    .option.missed .option-icon::after { content: "✓"; color: #f59e0b; display: block; }
    .option.correct .option-icon, .option.wrong .option-icon, .option.missed .option-icon { display: block; }
    .reveal-btn { margin-top: 1rem; background: #6366f1; color: #fff; border: none; padding: 0.5rem 1.2rem; border-radius: 7px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
    .reveal-btn:hover { background: #4f46e5; }
    .reveal-btn:disabled { opacity: 0.4; cursor: default; }

<body>
<div class="container">
  <h1>Mock Exam 2 — Full 65-Question Simulation</h1>
  <p class="subtitle">Pass mark ≈ 72% (47/65). Answer all questions, then review every miss.</p>
  <div class="scoreboard">
    <div><div class="score-label">Score</div><div class="score-value" id="score-display">0 <span>/ 0</span></div></div>
    <div><div class="score-label">Answered</div><div class="score-value" id="answered-display">0 <span>/ 65</span></div></div>

    <button class="reset-btn" onclick="resetAll()">Reset</button>

<script>
const questions = [
  { q: "An application on EC2 needs read access to an S3 bucket. What is the BEST approach?", correct: "B", options: { A: { text: "Embed an IAM user's access keys in environment variables", explanation: "Long-lived keys in environment variables can leak via logs, dumps, or process inspection — a persistent credential exposure risk." }, B: { text: "Attach an IAM role (instance profile) with a scoped S3 policy", explanation: "Correct. Instance profiles deliver automatically-rotated temporary credentials with no keys stored anywhere." }, C: { text: "Create an IAM user inside the application", explanation: "IAM users inside apps use long-lived keys — same exposure risk as embedded keys." }, D: { text: "Use the root account credentials", explanation: "Root credentials have unlimited permissions and should never be delegated to applications." } } },
  { q: "A queue must guarantee order AND exactly-once processing. Which SQS queue type?", correct: "B", options: { A: { text: "Standard queue", explanation: "Standard queue is unordered, at-least-once delivery — duplicates and out-of-order messages are possible." }, B: { text: "FIFO queue", explanation: "Correct. FIFO enforces strict first-in-first-out ordering and exactly-once delivery with deduplication." }, C: { text: "Dead-letter queue", explanation: "A DLQ is a destination for failed messages — not a queue type with ordering guarantees." }, D: { text: "Long polling only", explanation: "Long polling reduces empty receive calls — doesn't change ordering or deduplication behavior." } } },
  { q: "Which RDS feature automatically promotes a standby in another AZ with no data loss?", correct: "B", options: { A: { text: "Read replica", explanation: "Read replicas use asynchronous replication — potential data loss and no automatic write failover." }, B: { text: "Multi-AZ deployment", explanation: "Correct. Multi-AZ keeps a synchronous standby and automatically fails over within minutes — zero data loss." }, C: { text: "Automated snapshot restore", explanation: "Snapshot restore is manual, point-in-time — hours of data loss and manual effort." }, D: { text: "Storage Auto Scaling", explanation: "Storage Auto Scaling expands disk space automatically — unrelated to AZ failover." } } },
  { q: "Which statement about security groups is TRUE?", correct: "C", options: { A: { text: "Stateless — you must add both inbound and outbound rules for every connection", explanation: "Security groups are stateful — return traffic for allowed connections is automatically permitted." }, B: { text: "Support explicit deny rules like NACLs", explanation: "Security groups are allow-only. Only NACLs support explicit deny rules." }, C: { text: "Stateful and support only allow rules", explanation: "Correct. Security groups track connection state (stateful) and only allow rules — no deny rules possible." }, D: { text: "Apply at the subnet level", explanation: "Security groups apply at the instance/ENI level. NACLs apply at the subnet level." } } },
  { q: "A third-party API key must be auto-rotated every 30 days. Best service:", correct: "B", options: { A: { text: "KMS", explanation: "KMS manages encryption keys — not application secrets or third-party API credentials." }, B: { text: "Secrets Manager", explanation: "Correct. Secrets Manager has built-in rotation via Lambda and schedules — ideal for any third-party API keys." }, C: { text: "SSM Parameter Store", explanation: "Parameter Store can store secrets but has no built-in auto-rotation." }, D: { text: "AWS Config", explanation: "Config evaluates configuration compliance — not secret storage or rotation." } } },
  { q: "CloudFront must serve a private S3 bucket's content. Prevent direct S3 access:", correct: "B", options: { A: { text: "Enable S3 Transfer Acceleration", explanation: "Transfer Acceleration speeds up uploads — nothing to do with restricting direct access." }, B: { text: "Origin Access Control + bucket policy allowing only OAC", explanation: "Correct. OAC gives CloudFront a signing identity; the restrictive bucket policy blocks all other access." }, C: { text: "Use a NAT Gateway in front of S3", explanation: "NAT Gateway is for private EC2 outbound internet — not applicable to CloudFront/S3 access control." }, D: { text: "Place S3 in a private subnet", explanation: "S3 is a managed global service — it has no VPC subnet placement." } } },
  { q: "Determine who deleted a security group at 3am. Which service has the answer?", correct: "B", options: { A: { text: "CloudWatch Metrics", explanation: "CloudWatch Metrics records performance data — not API call identity or timing." }, B: { text: "CloudTrail", explanation: "Correct. CloudTrail logs every API call — DeleteSecurityGroup will show the caller's identity, timestamp, and IP." }, C: { text: "VPC Flow Logs", explanation: "VPC Flow Logs capture network traffic — not control-plane API calls." }, D: { text: "Inspector", explanation: "Inspector scans for vulnerabilities — not an API audit log." } } },
  { q: "Block known malicious IP ranges at Layer 7 for traffic entering an ALB:", correct: "B", options: { A: { text: "NACL deny rules", explanation: "NACLs deny at Layer 4 (IP/port) — they don't inspect HTTP payloads or managed threat intelligence feeds." }, B: { text: "WAF with IP reputation rules", explanation: "Correct. WAF attaches to ALB and has managed rule groups for known malicious IPs and Layer 7 threats." }, C: { text: "Security group deny", explanation: "Security groups are allow-only — no deny rules." }, D: { text: "GuardDuty", explanation: "GuardDuty detects and alerts — it doesn't actively block traffic." } } },
  { q: "Detect cryptocurrency mining on an EC2 instance based on anomalous network traffic:", correct: "B", options: { A: { text: "Macie", explanation: "Macie finds sensitive data in S3 — not network anomaly detection." }, B: { text: "GuardDuty", explanation: "Correct. GuardDuty has a specific finding type (CryptoCurrency:EC2/BitcoinTool) based on network and DNS anomalies." }, C: { text: "Inspector", explanation: "Inspector scans for software vulnerabilities — not runtime behavioral threats like crypto mining." }, D: { text: "Trusted Advisor", explanation: "Trusted Advisor gives best-practice recommendations — not runtime threat detection." } } },
  { q: "A stateless web app runs on an ASG. Where should user sessions be stored so no session is lost when an instance is replaced? (Choose TWO.)", correct: ["A","B"], multi: true, options: { A: { text: "ElastiCache (Redis)", explanation: "Correct. ElastiCache Redis is the standard shared session store — in-memory, fast, decoupled from any instance." }, B: { text: "DynamoDB", explanation: "Correct. DynamoDB provides a durable, highly available session store that any instance can read/write." }, C: { text: "Instance local storage", explanation: "Local (instance store) storage is ephemeral and tied to the instance — lost on replacement." }, D: { text: "EBS volume attached to one instance", explanation: "EBS attached to one instance can't be shared across the fleet — sessions on that volume are inaccessible to other instances." }, E: { text: "EC2 file system", explanation: "The local file system dies with the instance — same problem as instance store." } } },
  { q: "Capture raw VPC network traffic metadata (IPs, ports, accept/reject) for forensic analysis:", correct: "B", options: { A: { text: "CloudTrail", explanation: "CloudTrail logs AWS API calls — not raw network packet metadata." }, B: { text: "VPC Flow Logs", explanation: "Correct. VPC Flow Logs capture source/dest IP, port, protocol, bytes, and accept/reject per flow." }, C: { text: "GuardDuty", explanation: "GuardDuty consumes Flow Logs internally but doesn't expose raw flow records to you." }, D: { text: "Config", explanation: "Config tracks resource configuration changes — not network traffic." } } },
  { q: "A database needs a guaranteed, consistent 20,000 IOPS. Which EBS volume type?", correct: "C", options: { A: { text: "gp2", explanation: "gp2 IOPS burst from a credit bucket — can't consistently sustain 20,000 IOPS under continuous load." }, B: { text: "st1 (Throughput Optimized HDD)", explanation: "st1 is designed for high-throughput sequential reads, not high IOPS — max is ~500 IOPS." }, C: { text: "io2 (Provisioned IOPS SSD)", explanation: "Correct. io2 lets you provision exact IOPS — guaranteed, sustained performance for transactional databases." }, D: { text: "sc1 (Cold HDD)", explanation: "sc1 has the lowest IOPS of all EBS types — for cold, rarely accessed archival data." } } },
  { q: "Many Linux EC2 instances across multiple AZs need concurrent access to one shared file system:", correct: "B", options: { A: { text: "EBS gp3", explanation: "EBS is attached to one instance (Multi-Attach is same-AZ, limited to io1/io2) — not a cross-AZ shared file system." }, B: { text: "EFS (Elastic File System)", explanation: "Correct. EFS is a managed NFS file system that scales automatically and supports concurrent access across any number of instances and AZs." }, C: { text: "FSx for Windows File Server", explanation: "FSx for Windows uses SMB — not the right protocol for Linux POSIX access." }, D: { text: "S3 mounted as a file system", explanation: "S3 is object storage with eventual consistency — not a POSIX file system for typical application use." } } },
  { q: "Route HTTP requests to /images/* to an S3 origin and /api/* to an ECS target group:", correct: "B", options: { A: { text: "Network Load Balancer", explanation: "NLB is Layer 4 — no awareness of HTTP paths or URL-based routing." }, B: { text: "Application Load Balancer with path-based routing rules", explanation: "Correct. ALB listener rules inspect the URL path and route to different target groups." }, C: { text: "Route 53 geolocation routing", explanation: "Route 53 routes by DNS query origin — not by HTTP URL path." }, D: { text: "Gateway Load Balancer", explanation: "GWLB is for inline network appliances — not URL-based HTTP routing." } } },
  { q: "A web tier must survive an AZ failure and recover automatically with zero manual steps:", correct: "B", options: { A: { text: "Upsize to the largest EC2 instance", explanation: "A bigger single instance is still a single point of failure — it doesn't span AZs." }, B: { text: "Auto Scaling Group spread across multiple AZs", explanation: "Correct. ASG automatically replaces failed instances and distributes across AZs — zero manual intervention." }, C: { text: "Take hourly EBS snapshots", explanation: "Snapshots enable point-in-time restore — recovery still requires manual steps and has downtime." }, D: { text: "Use one subnet in the biggest AZ", explanation: "Single subnet means single AZ — the application fails entirely when that AZ goes down." } } },
  { q: "A client requires a static public IP for firewall allowlisting. The app receives millions of TCP connections:", correct: "B", options: { A: { text: "Application Load Balancer", explanation: "ALB doesn't have a static IP natively — its DNS resolves to changing IPs." }, B: { text: "Network Load Balancer with Elastic IP", explanation: "Correct. NLB supports Elastic (static) IPs per AZ, operates at Layer 4, and handles millions of connections with ultra-low latency." }, C: { text: "Gateway Load Balancer", explanation: "GWLB is for distributing traffic to third-party appliances — not general TCP load balancing." }, D: { text: "Classic Load Balancer", explanation: "Classic LB is legacy and doesn't guarantee static IPs." } } },
  { q: "Run code in response to an S3 object upload with zero idle infrastructure cost:", correct: "B", options: { A: { text: "EC2 On-Demand always running and polling S3", explanation: "Always-running EC2 pays 24/7 — wastes money when idle." }, B: { text: "Lambda triggered by S3 event", explanation: "Correct. Lambda costs nothing when idle and executes in milliseconds on the S3 event — truly zero idle cost." }, C: { text: "Fargate task running 24/7", explanation: "Fargate charges for CPU/memory while the task is running — idle time still costs money." }, D: { text: "ECS service with 1 always-running container", explanation: "Always-running container on ECS/EC2 or Fargate charges continuously." } } },
  { q: "Multiple independent services must each replay and process events from the same stream in their own order:", correct: "B", options: { A: { text: "SQS FIFO queue", explanation: "FIFO delivers each message once to one consumer group — other consumers can't independently replay it." }, B: { text: "Kinesis Data Streams", explanation: "Correct. Kinesis stores records for a configurable retention window and supports multiple independent consumer applications, each tracking its own position." }, C: { text: "SNS", explanation: "SNS is push-based with no retention — once delivered, messages are gone." }, D: { text: "SQS Standard", explanation: "Standard queue delivers each message once (ish) to one consumer — no replay, no ordering." } } },
  { q: "A multi-step approval workflow with human wait states, retries, and a visual audit trail:", correct: "B", options: { A: { text: "SQS FIFO queue with custom state tracking in a DB", explanation: "SQS queues are simple message buffers — managing multi-step state and human waits requires significant custom code." }, B: { text: "AWS Step Functions", explanation: "Correct. Step Functions manages state, handles waits (including human approval via callback), retries errors, and provides visual execution history." }, C: { text: "EventBridge", explanation: "EventBridge routes events based on rules — not a stateful multi-step workflow engine." }, D: { text: "SNS fan-out", explanation: "SNS pushes notifications to subscribers — no state management or wait-state capabilities." } } },
  { q: "A global TCP gaming app needs static anycast IPs, AWS-backbone routing, and sub-60s Region failover:", correct: "B", options: { A: { text: "CloudFront", explanation: "CloudFront is HTTP/HTTPS only — no static IPs and doesn't support arbitrary TCP." }, B: { text: "Global Accelerator", explanation: "Correct. Global Accelerator provides static anycast IPs, routes over the AWS backbone for any TCP/UDP protocol, and fails over between Regions in under 30 seconds." }, C: { text: "Route 53 latency routing", explanation: "Route 53 is DNS-based — no static IP, DNS TTL makes failover slower." }, D: { text: "Elastic Load Balancer in each Region independently", explanation: "Regional ELBs have dynamic IPs — no global anycast, no backbone routing." } } },
  { q: "DynamoDB leaderboard items are read thousands of times per second. Reduce latency to microseconds:", correct: "B", options: { A: { text: "Add a Global Secondary Index", explanation: "GSIs allow alternative query patterns — they don't reduce latency for hot-item reads." }, B: { text: "DynamoDB Accelerator (DAX)", explanation: "Correct. DAX is an in-memory cache in front of DynamoDB — reduces hot-item read latency from single-digit milliseconds to microseconds." }, C: { text: "ElastiCache for RDS", explanation: "ElastiCache caches RDS queries — this is DynamoDB, not RDS." }, D: { text: "Enable DynamoDB Global Tables", explanation: "Global Tables replicates across Regions — doesn't reduce local read latency." } } },
  { q: "A mobile app needs: (1) users to sign up/sign in with email/password, AND (2) those users to get temporary AWS credentials to upload to S3. (Choose TWO.)", correct: ["A","B"], multi: true, options: { A: { text: "Cognito User Pool", explanation: "Correct. Cognito User Pool handles sign-up, sign-in, MFA, and tokens for authentication." }, B: { text: "Cognito Identity Pool", explanation: "Correct. Cognito Identity Pool exchanges Cognito tokens for temporary AWS credentials (via STS) so users can directly access AWS services like S3." }, C: { text: "Create an IAM user per device", explanation: "Per-device IAM users have long-lived keys — doesn't scale and violates least privilege." }, D: { text: "SAML federation only", explanation: "SAML federation is for enterprise IdPs — not mobile user sign-up/sign-in." }, E: { text: "ACM certificates", explanation: "ACM issues TLS certificates for services — nothing to do with user authentication or AWS credential vending." } } },
  { q: "A single S3 upload event must trigger five different SQS queues simultaneously:", correct: "B", options: { A: { text: "Configure 5 separate S3 event triggers directly to each SQS", explanation: "S3 event notifications don't support delivering to multiple SQS queues from one event rule." }, B: { text: "S3 → SNS topic → 5 SQS subscriptions (fan-out)", explanation: "Correct. SNS fan-out is the standard pattern — one S3 event to SNS, five SQS queues subscribe." }, C: { text: "One SQS queue and have Lambda read it and split", explanation: "This works but adds a custom splitting Lambda — unnecessary complexity compared to SNS fan-out." }, D: { text: "EventBridge alone with no SNS", explanation: "EventBridge can fan out events but the S3 → SNS → SQS fan-out is the canonical pattern here." } } },
  { q: "Serve a static global website from S3 with minimum latency for users worldwide:", correct: "B", options: { A: { text: "Enable S3 Transfer Acceleration", explanation: "Transfer Acceleration speeds up uploads to S3 — it doesn't cache content close to end users." }, B: { text: "CloudFront distribution in front of S3", explanation: "Correct. CloudFront caches content at edge locations worldwide — dramatically reduces latency for global readers." }, C: { text: "CRR to every Region with 15 replicas", explanation: "CRR copies objects to other S3 buckets — users still download from a regional S3 URL, no edge caching benefit." }, D: { text: "S3 website hosting alone", explanation: "Hosting from a single S3 region means distant users face high latency." } } },
  { q: "Cross-Region relational DB replication with < 1 second lag and minute-level RTO on Regional failure:", correct: "B", options: { A: { text: "RDS Multi-AZ", explanation: "Multi-AZ is same-Region HA — the standby is in another AZ, not another Region." }, B: { text: "Aurora Global Database", explanation: "Correct. Aurora Global Database = cross-Region, < 1s replication lag, < 1 minute RTO on Regional failover." }, C: { text: "RDS read replica in another Region", explanation: "Cross-Region read replica uses async replication — more lag and no automatic write failover." }, D: { text: "DynamoDB Global Tables", explanation: "Global Tables is cross-Region active-active but NoSQL — not suitable for relational workloads." } } },
  { q: "A DynamoDB table must auto-scale from 10 to 100,000 WCU in seconds with zero pre-provisioning:", correct: "B", options: { A: { text: "Provisioned capacity with Auto Scaling", explanation: "Auto Scaling takes minutes to scale — can't respond fast enough to sudden 10,000x traffic spikes." }, B: { text: "On-Demand capacity mode", explanation: "Correct. On-Demand mode instantly handles any throughput burst with no capacity planning — you pay per request." }, C: { text: "DAX only", explanation: "DAX caches reads but doesn't affect write capacity — won't help write spikes." }, D: { text: "DynamoDB Global Tables", explanation: "Global Tables adds cross-Region replication — doesn't change per-table capacity management." } } },
  { q: "Batch ML training jobs need the cheapest compute but can tolerate being interrupted:", correct: "B", options: { A: { text: "On-Demand", explanation: "On-Demand is reliable but the most expensive per-hour — no discount for interruptible workloads." }, B: { text: "Spot Instances", explanation: "Correct. Spot gives up to 90% off On-Demand and is ideal for fault-tolerant, checkpoint-restartable ML jobs." }, C: { text: "Reserved Instances", explanation: "Reserved Instances suit steady 24/7 workloads — wasteful billing for occasional batch jobs." }, D: { text: "Dedicated Hosts", explanation: "Dedicated Hosts are the most expensive option — for licensing/compliance requirements." } } },
  { q: "A company runs Lambda, Fargate, and varied EC2 instances. Max savings with 3-year flexible commitment:", correct: "B", options: { A: { text: "EC2 Standard Reserved Instances", explanation: "EC2 Standard RIs lock you to a specific instance family and Region — no coverage for Lambda or Fargate." }, B: { text: "Compute Savings Plans", explanation: "Correct. Compute Savings Plans give up to 72% savings across all EC2 families, Regions, Fargate, and Lambda." }, C: { text: "EC2 Instance Savings Plans", explanation: "Instance Savings Plans cover EC2 for one family in one Region — no Lambda or Fargate coverage." }, D: { text: "Spot Instances", explanation: "Spot can be reclaimed — not suitable for steady production workloads." } } },
  { q: "S3 objects have unknown, changing access patterns. Minimize cost with no retrieval fees:", correct: "B", options: { A: { text: "Standard-IA", explanation: "Standard-IA charges retrieval fees — if access is frequent, costs can exceed Standard." }, B: { text: "Intelligent-Tiering", explanation: "Correct. Intelligent-Tiering monitors access frequency and moves objects automatically — zero retrieval fees." }, C: { text: "Glacier Instant Retrieval", explanation: "Glacier Instant Retrieval has retrieval fees — wrong if access pattern could be frequent." }, D: { text: "One Zone-IA", explanation: "One Zone-IA has retrieval fees and single-AZ durability risk — not appropriate for unknown access patterns." } } },
  { q: "Compliance logs must be kept for 7 years. After 90 days, access becomes extremely rare. Cheapest lifecycle:", correct: "B", options: { A: { text: "Delete after 90 days", explanation: "Deletion violates the 7-year retention requirement." }, B: { text: "Standard for 90 days → Glacier Deep Archive → expire at 7 years", explanation: "Correct. Standard for active access, then Glacier Deep Archive ($0.00099/GB/month) for the archive years — cheapest long-term storage." }, C: { text: "Standard-IA from day 1", explanation: "Standard-IA has retrieval fees during the first 90 days of frequent access." }, D: { text: "Keep all in Standard for 7 years", explanation: "Standard pricing for 7 years is far more expensive than tiering to Glacier after the active window." } } },
  { q: "Alert the finance team when actual AWS spend this month exceeds $10,000:", correct: "B", options: { A: { text: "Cost Explorer", explanation: "Cost Explorer analyzes historical spend — it doesn't send proactive threshold alerts." }, B: { text: "AWS Budgets with an SNS alert", explanation: "Correct. Budgets monitors actual and forecasted spend and sends SNS notifications when thresholds are breached." }, C: { text: "Trusted Advisor", explanation: "Trusted Advisor gives best-practice checks — not custom spend threshold alerting." }, D: { text: "Cost and Usage Report", explanation: "CUR is a data source for analysis — not an alerting tool." } } },
  { q: "Which gives ML-based right-sizing recommendations for EC2 instance types?", correct: "A", options: { A: { text: "AWS Compute Optimizer", explanation: "Correct. Compute Optimizer uses ML and CloudWatch metrics to recommend optimal EC2 sizes, EBS volumes, and Lambda memory settings." }, B: { text: "CloudTrail", explanation: "CloudTrail is an API audit log — no utilization analysis or recommendations." }, C: { text: "Config", explanation: "Config evaluates configuration compliance — not instance utilization or sizing." }, D: { text: "GuardDuty", explanation: "GuardDuty detects threats — unrelated to cost optimization." } } },
  { q: "Combine billing for 15 AWS accounts to get one invoice and volume-tier discounts:", correct: "A", options: { A: { text: "AWS Organizations consolidated billing", explanation: "Correct. Consolidated billing aggregates usage across all accounts for volume pricing and issues a single invoice." }, B: { text: "AWS Savings Plans", explanation: "Savings Plans reduce per-unit cost through commitment — not billing consolidation." }, C: { text: "AWS Budgets", explanation: "Budgets is for cost alerting — not billing consolidation." }, D: { text: "Cost Explorer cross-account view", explanation: "Cost Explorer provides visibility — not consolidated invoicing." } } },
  { q: "A relational DB workload runs only on weekdays during business hours. Most cost-effective option:", correct: "B", options: { A: { text: "Always-on large RDS instance", explanation: "Always-on RDS charges 24/7 including off-hours and weekends." }, B: { text: "Aurora Serverless v2", explanation: "Correct. Aurora Serverless v2 scales capacity to near-zero when idle — you pay only for actual usage." }, C: { text: "DynamoDB on-demand", explanation: "DynamoDB is NoSQL, not relational — wrong service for this requirement." }, D: { text: "Redshift Serverless", explanation: "Redshift is an OLAP data warehouse — not the right service for an OLTP relational workload." } } },
  { q: "Predictable 24/7 Linux workload for 3 years, same instance family and Region. Best commitment-based saving:", correct: "B", options: { A: { text: "Spot Instances", explanation: "Spot Instances can be reclaimed — unsuitable for steady 24/7 production workloads." }, B: { text: "EC2 Instance Savings Plans", explanation: "Correct. Instance Savings Plans give up to 72% off for a specific EC2 family in a Region — the highest discount for fixed, predictable workloads." }, C: { text: "On-Demand", explanation: "On-Demand is the most expensive option — no commitment savings." }, D: { text: "Dedicated Hosts", explanation: "Dedicated Hosts address licensing/compliance — more expensive than Savings Plans for cost optimization." } } },
  { q: "Dev/test instances are used only during business hours. They can tolerate unexpected interruptions:", correct: "A", options: { A: { text: "Spot Instances", explanation: "Correct. Dev/test workloads are interruptible — Spot gives up to 90% off On-Demand for this use case." }, B: { text: "Reserved Instances", explanation: "Reserved Instances charge a commitment fee even during idle off-hours and weekends." }, C: { text: "On-Demand", explanation: "On-Demand pays full price — no savings for interruptible workloads." }, D: { text: "Dedicated Hosts", explanation: "Dedicated Hosts are always-on, always-billed — the opposite of cost-optimized." } } },
  { q: "Automatically stop dev EC2 instances at 6pm and restart at 8am on weekdays:", correct: "B", options: { A: { text: "Purchase Reserved Instances for shorter terms", explanation: "Reserved Instances don't control instance runtime — you still pay whether they're running or stopped." }, B: { text: "EventBridge scheduled rules triggering SSM or Lambda stop/start", explanation: "Correct. EventBridge cron expressions trigger stop/start actions on a schedule — eliminates off-hours compute charges." }, C: { text: "Upsize instances to finish work faster", explanation: "Upsizing doesn't stop the instances — still runs overnight." }, D: { text: "Use Spot Instances", explanation: "Spot saves money per-hour but doesn't automatically stop/start on a schedule." } } },
  { q: "Private EC2 instances access S3 and incur large NAT Gateway data-processing charges. Fix:", correct: "B", options: { A: { text: "Add a second NAT Gateway for redundancy", explanation: "More NAT Gateways don't reduce per-GB data processing fees — they'd increase cost." }, B: { text: "Create an S3 Gateway VPC Endpoint", explanation: "Correct. S3 Gateway Endpoints are free and route S3 traffic directly within AWS — eliminating NAT data charges entirely." }, C: { text: "Move instances to public subnets", explanation: "Public subnets remove NAT costs but expose instances directly to the internet — a security tradeoff." }, D: { text: "Use PrivateLink for S3", explanation: "PrivateLink for S3 uses Interface Endpoints which have hourly + per-GB charges — more expensive than Gateway Endpoints." } } },
  { q: "Infrequently accessed objects that can be recreated if lost — cheapest S3 class with no AZ durability:", correct: "B", options: { A: { text: "Glacier Instant Retrieval", explanation: "Glacier Instant Retrieval is cheaper but designed for archival — millisecond retrieval but with retrieval fees." }, B: { text: "S3 One Zone-IA", explanation: "Correct. One Zone-IA stores in a single AZ (acceptable since objects are re-creatable) at ~20% less than Standard-IA." }, C: { text: "Standard-IA", explanation: "Standard-IA is multi-AZ — more expensive than needed for re-creatable data." }, D: { text: "Standard", explanation: "Standard is the most expensive class — overkill for rarely accessed, re-creatable content." } } },
  { q: "Continuously audit whether all S3 buckets block public access. Flag non-compliant:", correct: "A", options: { A: { text: "AWS Config rule (s3-bucket-public-read-prohibited)", explanation: "Correct. Config rules continuously evaluate resources and flag non-compliant ones — ideal for ongoing compliance checks." }, B: { text: "CloudTrail", explanation: "CloudTrail records the API call that changed the setting — but doesn't continuously re-evaluate current state." }, C: { text: "GuardDuty", explanation: "GuardDuty detects threats — not configuration compliance." }, D: { text: "Macie", explanation: "Macie scans S3 data for sensitive content — not bucket configuration compliance." } } },
  { q: "Securely access EC2 shell in a private subnet with no bastion host, no open SSH port:", correct: "B", options: { A: { text: "Open port 22 to the specific admin IP only", explanation: "Open SSH ports are an attack surface — even limited to one IP, the requirement was no open port." }, B: { text: "SSM Session Manager", explanation: "Correct. Session Manager establishes a shell session through the SSM agent over HTTPS — no inbound ports, no bastion, fully audited." }, C: { text: "Direct Connect", explanation: "Direct Connect is a private network link to on-premises — not a session management tool." }, D: { text: "VPC Transit Gateway", explanation: "Transit Gateway connects networks — not EC2 shell access." } } },
  { q: "Which provides agentless threat detection by analyzing CloudTrail, Flow Logs, and DNS logs?", correct: "B", options: { A: { text: "Inspector", explanation: "Inspector is agent-based (for EC2/ECR) and scans for software vulnerabilities — not agentless threat detection from logs." }, B: { text: "GuardDuty", explanation: "Correct. GuardDuty is agentless — it analyzes exactly those three sources to detect threats without installing anything." }, C: { text: "Macie", explanation: "Macie classifies sensitive data in S3 — not a threat detection service." }, D: { text: "Config", explanation: "Config tracks configuration compliance — not threat detection from behavioral signals." } } },
  { q: "A company needs Layer 7 DDoS protection, a DDoS response team, and cost protection against DDoS-induced scaling bills:", correct: "B", options: { A: { text: "Shield Standard", explanation: "Shield Standard is free and automatic but covers only L3/L4 — no response team, no cost protection." }, B: { text: "Shield Advanced", explanation: "Correct. Shield Advanced adds L7 DDoS protection, the AWS DDoS Response Team (DRT), and cost protection for scaling triggered by DDoS events." }, C: { text: "WAF alone", explanation: "WAF blocks web attacks but has no DDoS response team or cost protection." }, D: { text: "NACL deny rules", explanation: "NACLs operate at L4 — no Layer 7 protection and no response team." } } },
  { q: "Automatically discover and classify PII across thousands of S3 buckets:", correct: "B", options: { A: { text: "Inspector", explanation: "Inspector scans compute workloads for vulnerabilities — not S3 data classification." }, B: { text: "Macie", explanation: "Correct. Macie uses ML to scan S3 buckets and identify sensitive data including PII, financial data, and credentials." }, C: { text: "GuardDuty", explanation: "GuardDuty detects threats — not data classification." }, D: { text: "Config", explanation: "Config evaluates resource configurations — not the content of S3 objects." } } },
  { q: "Prevent ALL accounts in an Organization from creating resources outside us-east-1, even account-level admins:", correct: "B", options: { A: { text: "IAM permissions boundary on every user", explanation: "Permissions boundaries apply per-identity — account admins can remove or modify them for themselves." }, B: { text: "SCP at the organization root", explanation: "Correct. SCPs set a ceiling that even root users and account admins in member accounts cannot exceed." }, C: { text: "Bucket policy", explanation: "Bucket policies control access to S3 buckets — not cross-service, cross-account regional guardrails." }, D: { text: "Service-linked role", explanation: "Service-linked roles are for AWS service integrations — not org-wide access control." } } },
  { q: "Centralized SSO for 50 AWS accounts using the company's Azure AD IdP:", correct: "B", options: { A: { text: "Create IAM users in every account", explanation: "Per-account IAM users don't integrate with Azure AD and require separate credential management everywhere." }, B: { text: "IAM Identity Center with Azure AD SAML federation", explanation: "Correct. IAM Identity Center supports external SAML/OIDC IdPs like Azure AD — SSO to all accounts from one portal." }, C: { text: "Cognito user pool", explanation: "Cognito is for application end-users — not enterprise workforce SSO across AWS accounts." }, D: { text: "Direct AssumeRole calls for each account", explanation: "Manual AssumeRole without a portal is not SSO — requires credentials or pre-authenticated sessions everywhere." } } },
  { q: "Encrypt S3 at rest with a customer-managed key and a full audit trail of key usage:", correct: "B", options: { A: { text: "SSE-S3 (AES-256)", explanation: "SSE-S3 uses AWS-managed keys — no customer control over the key policy and no per-usage audit in CloudTrail." }, B: { text: "SSE-KMS with a customer managed CMK", explanation: "Correct. Customer managed CMKs log every encrypt/decrypt call to CloudTrail and give you full control over key policy and rotation." }, C: { text: "SSE-C (customer-provided key)", explanation: "SSE-C requires you to supply the key on every request — high operational overhead, and AWS has no visibility into key usage." }, D: { text: "No encryption", explanation: "No encryption fails both the encryption-at-rest and audit requirements." } } },
  { q: "Single-tenant, customer-controlled HSM meeting FIPS 140-2 Level 3:", correct: "B", options: { A: { text: "AWS KMS (standard)", explanation: "KMS runs on multi-tenant shared hardware meeting Level 2 — not Level 3, not single-tenant." }, B: { text: "AWS CloudHSM", explanation: "Correct. CloudHSM provides dedicated, single-tenant hardware security modules validated to FIPS 140-2 Level 3." }, C: { text: "Secrets Manager", explanation: "Secrets Manager stores secrets — not a hardware security module." }, D: { text: "ACM Private CA", explanation: "ACM Private CA issues private certificates — not an HSM." } } },
  { q: "Prevent permanent deletion of S3 object versions even by the bucket owner:", correct: "A", options: { A: { text: "MFA Delete", explanation: "Correct. MFA Delete requires multi-factor authentication to permanently delete object versions — even the bucket owner must MFA." }, B: { text: "S3 Cross-Region Replication", explanation: "CRR copies objects to another Region — doesn't prevent deletion in the source bucket." }, C: { text: "Versioning alone", explanation: "Versioning creates a delete marker but the root user can still permanently delete versions without additional protection." }, D: { text: "Bucket policy deny DeleteObject", explanation: "Even deny policies on the root user are not effective — MFA Delete is the specific control for this." } } },
  { q: "Lambda needs database credentials, no rotation required, cost must be minimal:", correct: "B", options: { A: { text: "Secrets Manager", explanation: "Secrets Manager works but charges ~$0.40/secret/month — unnecessary cost when rotation isn't needed." }, B: { text: "SSM Parameter Store SecureString", explanation: "Correct. Standard SecureString parameters are free — encrypted via KMS, accessible in Lambda via SDK with no per-parameter cost." }, C: { text: "Hardcode in Lambda environment variables (plain text)", explanation: "Plain-text env vars are visible in the console and can leak via logs — not secure." }, D: { text: "S3 plaintext file", explanation: "Unencrypted credentials in S3 are easily exfiltrated — not secure." } } },
  { q: "Automated, policy-driven backups across EBS, RDS, DynamoDB, EFS, with cross-Region copy:", correct: "B", options: { A: { text: "Manual snapshot scripts per service", explanation: "Manual scripts are error-prone, inconsistent, and hard to audit at scale." }, B: { text: "AWS Backup", explanation: "Correct. AWS Backup centralizes backup management for all listed services with policy automation, cross-Region copy, and compliance reporting." }, C: { text: "S3 Lifecycle rules", explanation: "S3 Lifecycle manages S3 object transitions — can't back up EBS, RDS, or DynamoDB." }, D: { text: "Data Lifecycle Manager", explanation: "DLM manages EBS snapshot and AMI lifecycles only — not RDS, DynamoDB, or EFS." } } },
  { q: "Primary Region is unhealthy. Route 53 must automatically redirect traffic to the secondary Region:", correct: "B", options: { A: { text: "Weighted routing", explanation: "Weighted routing splits traffic by percentage — not health-based automatic failover." }, B: { text: "Failover routing with health checks", explanation: "Correct. Failover routing is active-passive — traffic automatically moves to the secondary record when the primary health check fails." }, C: { text: "Latency routing", explanation: "Latency routing sends to the lowest-latency Region — not health-based active-passive failover." }, D: { text: "Geolocation routing", explanation: "Geolocation routes based on user location — not endpoint health." } } },
  { q: "Hub-and-spoke network design connecting 50 VPCs and on-premises offices transitively:", correct: "B", options: { A: { text: "VPC peering for every pair", explanation: "n VPCs require n*(n-1)/2 peering connections and peering is non-transitive — this approach doesn't scale." }, B: { text: "Transit Gateway", explanation: "Correct. Transit Gateway is a transitive hub — all VPCs and on-prem attachments connect once, and any-to-any routing works." }, C: { text: "PrivateLink for each service", explanation: "PrivateLink is for exposing a specific service — not a general-purpose routing hub." }, D: { text: "Internet Gateway for each VPC", explanation: "Internet Gateways connect VPCs to the public internet — not private VPC-to-VPC or on-prem routing." } } },
  { q: "Multi-Region active-active NoSQL with single-digit millisecond reads everywhere:", correct: "A", options: { A: { text: "DynamoDB Global Tables", explanation: "Correct. Global Tables replicates DynamoDB across Regions with active-active writes and consistent low latency globally." }, B: { text: "RDS Multi-AZ", explanation: "Multi-AZ is single-Region — standby in another AZ, not another Region." }, C: { text: "Aurora read replicas", explanation: "Aurora cross-Region read replicas are read-only — no active-active writes." }, D: { text: "ElastiCache cluster", explanation: "ElastiCache is in-memory caching — not a multi-Region active-active database." } } },
  { q: "Auto-transcribe customer call recordings in S3 AND detect customer sentiment from the transcripts. (Choose TWO.)", correct: ["A","C"], multi: true, options: { A: { text: "Amazon Transcribe", explanation: "Correct. Transcribe converts audio recordings to text — used here to generate call transcripts from S3." }, B: { text: "Amazon Polly", explanation: "Polly converts text to speech — the opposite direction. Not useful for transcribing call recordings." }, C: { text: "Amazon Comprehend", explanation: "Correct. Comprehend performs natural language processing including sentiment analysis on text output from Transcribe." }, D: { text: "Amazon Rekognition", explanation: "Rekognition analyzes images and video — not audio or text sentiment." }, E: { text: "Amazon Lex", explanation: "Lex builds conversational chatbots — not a batch sentiment analysis service." } } },
  { q: "Stream IoT sensor data to S3 and Redshift with no consumer code, near-real-time:", correct: "A", options: { A: { text: "Kinesis Data Firehose", explanation: "Correct. Firehose is fully managed — it buffers and delivers to S3 and Redshift automatically with no consumer code." }, B: { text: "Kinesis Data Streams", explanation: "Data Streams requires you to write and manage consumer applications — not 'no consumer code'." }, C: { text: "SQS", explanation: "SQS requires a custom consumer to pull and write to S3/Redshift — not a zero-code streaming delivery." }, D: { text: "AWS Glue", explanation: "Glue is a batch ETL service — not a real-time streaming delivery tool." } } },
  { q: "Serverless SQL against petabyte-scale data stored in S3, pay-per-query:", correct: "C", options: { A: { text: "Amazon EMR", explanation: "EMR runs managed big-data clusters — not serverless, and requires cluster management." }, B: { text: "Amazon Redshift", explanation: "Redshift requires loading data into the cluster — not directly on S3, not fully serverless." }, C: { text: "Amazon Athena", explanation: "Correct. Athena is fully serverless SQL directly on S3 — pay per TB scanned, no infrastructure." }, D: { text: "Amazon RDS", explanation: "RDS is a persistent relational DB engine — requires loading data and running an instance." } } },
  { q: "HPC genomics pipeline needs a high-throughput POSIX file system that natively integrates with S3:", correct: "B", options: { A: { text: "EFS", explanation: "EFS is a general-purpose NFS file system — not optimized for HPC throughput." }, B: { text: "FSx for Lustre", explanation: "Correct. FSx for Lustre is a high-performance HPC/ML file system with native S3 integration for data staging." }, C: { text: "EBS st1", explanation: "st1 is HDD throughput storage for a single instance — not a shared HPC file system." }, D: { text: "Instance store", explanation: "Instance store is ephemeral and local to one node — can't be shared across an HPC cluster." } } },
  { q: "Windows application needs shared SMB file system with Active Directory group policies:", correct: "B", options: { A: { text: "EFS", explanation: "EFS is NFS for Linux — no SMB protocol or native Active Directory integration." }, B: { text: "FSx for Windows File Server", explanation: "Correct. FSx for Windows is fully managed Windows SMB with native AD integration, including group policy support." }, C: { text: "EBS Multi-Attach", explanation: "EBS Multi-Attach supports up to 16 instances in the same AZ — limited, not an AD-integrated file system." }, D: { text: "S3", explanation: "S3 is object storage — not a Windows file system." } } },
  { q: "Fastest fix for an RDS instance overwhelmed by thousands of identical repeated read queries:", correct: "C", options: { A: { text: "Vertically scale the RDS instance", explanation: "Scaling up is expensive and a short-term fix — the root cause is repeated identical queries, not compute." }, B: { text: "Enable Multi-AZ", explanation: "Multi-AZ standby is not readable — no improvement in read throughput." }, C: { text: "Add an ElastiCache caching layer", explanation: "Correct. ElastiCache caches repeated identical query results in memory — the DB barely sees repeat calls." }, D: { text: "Migrate to Redshift", explanation: "Redshift is an OLAP data warehouse — migrating a production OLTP DB is a major, slow change." } } },
  { q: "In a pilot-light DR strategy, what MUST remain running at all times in the DR Region?", correct: "B", options: { A: { text: "The full application and web tier", explanation: "Full running tiers in both Regions is active/standby or warm standby — not pilot light." }, B: { text: "The core data tier (DB replica)", explanation: "Correct. Pilot light keeps only the critical data tier running — the app tier is started on demand during failover." }, C: { text: "Nothing — everything starts from backup on failover", explanation: "Nothing running is backup/restore — pilot light requires at least the DB to be live." }, D: { text: "Only Route 53 health checks", explanation: "Route 53 is a global DNS service, always available — it's not what 'pilot light' refers to running." } } },
  { q: "An SQS message fails processing 5 times. Where does it automatically go?", correct: "B", options: { A: { text: "The message is permanently deleted", explanation: "SQS doesn't delete messages on processing failure — it returns them to the queue or moves them to a DLQ." }, B: { text: "Dead-letter queue (if configured)", explanation: "Correct. When a message exceeds the maxReceiveCount, SQS moves it to the configured DLQ for inspection." }, C: { text: "Back to the beginning of the queue", explanation: "The message goes back to the queue (becomes visible again) up to the retry limit — then to the DLQ." }, D: { text: "SNS topic for alerts", explanation: "SQS doesn't automatically forward failed messages to SNS — that requires custom code." } } },
  { q: "Maximum acceptable data loss = 24 hours. Budget is minimal. RTO = several hours. Which DR strategy?", correct: "D", options: { A: { text: "Active/active multi-Region", explanation: "Active/active is the most expensive and provides near-zero RPO — overkill for 24h RPO tolerance." }, B: { text: "Warm standby", explanation: "Warm standby keeps a scaled-down environment running — more expensive than needed for 24h RPO." }, C: { text: "Pilot light", explanation: "Pilot light keeps the DB running — cheaper than warm standby but more than backup/restore." }, D: { text: "Backup and restore", explanation: "Correct. Backup and restore is cheapest — pay only for stored backups. With 24h RPO tolerance and several-hours RTO, it fully meets requirements." } } },
  { q: "Private subnet EC2 instances need to download OS updates from the internet, but must be unreachable inbound:", correct: "B", options: { A: { text: "Attach an Internet Gateway directly", explanation: "An internet gateway makes instances reachable from the internet if they have public IPs — violates the 'unreachable inbound' requirement." }, B: { text: "NAT Gateway in the public subnet", explanation: "Correct. NAT Gateway allows outbound-initiated connections only — inbound connections from the internet are blocked." }, C: { text: "VPC peering to a public VPC", explanation: "VPC peering connects private networks — not a path to the public internet." }, D: { text: "Direct Connect to on-premises", explanation: "Direct Connect is a private link to on-premises — not public internet access." } } },
  { q: "Many Linux EC2 instances across AZs need a shared POSIX file system that auto-scales:", correct: "B", options: { A: { text: "EBS volume shared via NFS manually", explanation: "Self-managed NFS on EBS is in one AZ and requires managing the NFS server — not scalable or managed." }, B: { text: "EFS (Elastic File System)", explanation: "Correct. EFS is a fully managed NFS file system — auto-scales, supports concurrent access from unlimited instances across AZs." }, C: { text: "FSx for Lustre", explanation: "FSx for Lustre is for HPC/ML high-performance workloads — general shared POSIX access across AZs is EFS." }, D: { text: "Instance store", explanation: "Instance store is ephemeral and local — can't be shared across instances." } } }
];

let selected = new Array(questions.length).fill(null);
let revealed = new Array(questions.length).fill(false);

function isCorrect(qIndex) {
  const q = questions[qIndex];
  const sel = selected[qIndex];
  if (q.multi) { if (!sel || sel.size !== q.correct.length) return false; return q.correct.every(c => sel.has(c)); }
  return sel === q.correct;
}

function updateScore() {
  const answeredCount = revealed.filter(Boolean).length;
  const correctCount = revealed.filter((r, i) => r && isCorrect(i)).length;
  document.getElementById('score-display').innerHTML = `${correctCount} <span>/ ${answeredCount}</span>`;
  document.getElementById('answered-display').innerHTML = `${answeredCount} <span>/ ${questions.length}</span>`;
}

function selectOption(qIndex, letter) {
  if (revealed[qIndex]) return;
  const q = questions[qIndex];
  const card = document.querySelector(`[data-q="${qIndex}"]`);
  const optEl = card.querySelector(`[data-opt="${letter}"]`);
  if (q.multi) {
    if (!selected[qIndex]) selected[qIndex] = new Set();
    if (selected[qIndex].has(letter)) { selected[qIndex].delete(letter); optEl.classList.remove('selected'); }
    else { selected[qIndex].add(letter); optEl.classList.add('selected'); }
    card.querySelector('.reveal-btn').disabled = selected[qIndex].size === 0;
  } else {
    selected[qIndex] = letter;
    card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    optEl.classList.add('selected');
    card.querySelector('.reveal-btn').disabled = false;
  }
}

function reveal(qIndex) {
  if (revealed[qIndex]) return;
  revealed[qIndex] = true;
  const q = questions[qIndex];
  const card = document.querySelector(`[data-q="${qIndex}"]`);
  const sel = q.multi ? (selected[qIndex] || new Set()) : new Set(selected[qIndex] ? [selected[qIndex]] : []);
  const correctSet = new Set(q.multi ? q.correct : [q.correct]);
  card.classList.add('answered');
  card.querySelectorAll('.option').forEach(opt => {
    opt.classList.add('disabled');
    const letter = opt.dataset.opt;
    const isC = correctSet.has(letter), isS = sel.has(letter);
    opt.classList.remove('selected');
    if (isC && isS) opt.classList.add('correct');
    else if (isC && !isS) opt.classList.add('missed');
    else if (!isC && isS) opt.classList.add('wrong');
    else opt.classList.add('neutral');
  });
  const btn = card.querySelector('.reveal-btn');
  btn.disabled = true; btn.textContent = 'Revealed';
  const badge = card.querySelector('.result-badge');
  badge.style.display = 'inline-block';
  const correct = isCorrect(qIndex);
  const correctLabel = q.multi ? q.correct.join(' & ') : q.correct;
  if (correct) { badge.className = 'result-badge correct-badge'; badge.textContent = 'Correct'; }
  else { badge.className = 'result-badge wrong-badge'; badge.textContent = sel.size === 0 ? `No answer — ${correctLabel} correct` : `Wrong — ${correctLabel} correct`; }
  updateScore();
}

function resetAll() {
  selected = new Array(questions.length).fill(null);
  revealed = new Array(questions.length).fill(false);
  render(); updateScore();
}

function render() {
  document.getElementById('quiz').innerHTML = questions.map((q, i) => `
    <div class="question-card" data-q="${i}">
      <div class="question-header"><span class="q-number">Q${i+1}</span>
        <div style="flex:1"><div class="q-text">${q.q}</div>${q.multi ? '<div class="q-multi-hint">▸ Choose TWO</div>' : ''}</div>
      </div>
      <div class="options">${Object.entries(q.options).map(([letter, opt]) => `
        <div class="option" data-opt="${letter}" onclick="selectOption(${i},'${letter}')">
          <div class="option-letter">${letter}</div>
          <div class="option-body"><div class="option-text">${opt.text}</div><div class="option-explanation">${opt.explanation}</div></div>
          <div class="option-icon"></div>
        </div>`).join('')}
      </div>
      <div style="display:flex;align-items:center;margin-top:1rem;">
        <button class="reveal-btn" onclick="reveal(${i})" disabled>Reveal Answer</button>
        <span class="result-badge"></span>
      </div>
    </div>`).join('');
}

render(); updateScore();
</script>
